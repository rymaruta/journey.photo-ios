<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="common.css">
<style>
.main{position:absolute;left:0;right:0;top:54px;bottom:96px;overflow:auto;padding:8px 16px 20px}
h1{font-size:28px;margin:8px 0 4px}
.sub{font-size:12px;color:rgba(255,255,255,.55);line-height:1.5;margin-bottom:14px}
.lbl{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.lbl .mono{font-size:11px;letter-spacing:.14em;color:#C9A66B;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.lbl .line{flex:1;height:1px;background:rgba(255,255,255,.12)}
.lbl .hint{font-size:11px;color:rgba(255,255,255,.4)}
.chips{display:flex;gap:8px;margin-bottom:18px}
.chip{
  width:68px;min-height:72px;border-radius:14px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-size:10px;text-align:center;line-height:1.2;color:rgba(255,255,255,.9)
}
.chip.hot{background:rgba(201,166,107,.12);border-color:rgba(201,166,107,.4);color:#C9A66B}
.hero{position:relative;height:200px;border-radius:18px;overflow:hidden;margin-bottom:8px}
.hero .cap{position:absolute;left:0;right:0;bottom:0;padding:40px 16px 14px;background:linear-gradient(to top,rgba(0,0,0,.85),transparent);display:flex;justify-content:space-between;align-items:flex-end}
.hero .cap .t{font-size:22px}
.hero .cap .d{font-size:11px;color:rgba(255,255,255,.82);font-variant-numeric:tabular-nums;margin-top:3px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px}
.pair .c{position:relative;height:118px;border-radius:14px;overflow:hidden}
.pair .c span{position:absolute;left:10px;bottom:10px;font-size:14px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.list{border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.10);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px;border-bottom:1px solid rgba(255,255,255,.08)}
.row:last-child{border-bottom:0}
.icon{width:36px;height:36px;border-radius:10px;background:#161617;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85);flex-shrink:0}
.icon.hot{color:#C9A66B}
.row .txt{flex:1;min-width:0}
.row .txt b{display:block;font-size:15px}
.row .txt small{display:block;font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}
.chev{color:rgba(255,255,255,.3)}
</style>
</head><body>
<div class="phone">
  <div class="status"><span class="time">9:41</span><span class="icons">■■▮ ▮▮</span></div>
  <div class="main">
    <h1 class="serif">旅の記録</h1>
    <p class="sub">同じころに撮った写真が、ひとつの旅にまとまります</p>

    <div class="lbl"><span class="mono">TOOLS</span><span class="line"></span><span class="hint">すぐ開く</span></div>
    <div class="chips">
      <div class="chip">▦<br>アルバム</div>
      <div class="chip">▦<br>プラン</div>
      <div class="chip">▦<br>すれちがい</div>
      <div class="chip hot">👜<br>トランク</div>
      <div class="chip hot">🚐<br>キャンパー</div>
    </div>

    <div class="lbl"><span class="mono">TRIP BOOKS</span><span class="line"></span><span class="hint">3 冊</span></div>
    <div class="hero img" style="background-image:url('https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?w=800&q=70')">
      <div class="cap">
        <div><div class="serif t">金沢の旅</div><div class="d">2026.09.12 — 09.14</div></div>
        <div class="d">3日間 · 48枚</div>
      </div>
    </div>
    <div class="pair">
      <div class="c img" style="background-image:url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=400&q=70')"><span class="serif">白川郷の旅</span></div>
      <div class="c img" style="background-image:url('https://images.unsplash.com/photo-1469474968028-56623f02e42e?w=400&q=70')"><span class="serif">京都の旅</span></div>
    </div>

    <div class="lbl"><span class="mono">TOOLS</span><span class="line"></span><span class="hint">旅の道具</span></div>
    <div class="list">
      <div class="row"><div class="icon">▦</div><div class="txt"><b class="serif">共同アルバム</b><small>旅の仲間と写真を集める</small></div><span class="chev">›</span></div>
      <div class="row"><div class="icon">▦</div><div class="txt"><b class="serif">旅行プラン</b><small>行きたい場所タブの場所を、回る順に</small></div><span class="chev">›</span></div>
      <div class="row"><div class="icon hot">👜</div><div class="txt"><b class="serif">旅のトランク</b><small>投稿のお礼に届くラベル</small></div><span class="chev">›</span></div>
      <div class="row"><div class="icon hot">🚐</div><div class="txt"><b class="serif">キャンピングカー</b><small>写真で育つ車 · 旅を重ねるほど</small></div><span class="chev">›</span></div>
    </div>
  </div>
  <nav class="tabbar">
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11h14V9"/></svg>ホーム<span class="dot"></span></div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>探す<span class="dot"></span></div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="5"/><path d="M12 8v8M8 12h8"/></svg>投稿<span class="dot"></span></div>
    <div class="tab"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="m9 4-6 2.5v13.5l6-2.5 6 2.5 6-2.5V4l-6 2.5z"/><path d="M9 4v13.5M15 6.5V20"/></svg>マップ<span class="dot"></span></div>
    <div class="tab on"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>マイページ<span class="dot"></span></div>
  </nav>
  <div class="home-bar"></div>
</div>
</body></html>
