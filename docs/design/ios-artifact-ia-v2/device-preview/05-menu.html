<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8"><meta name="viewport" content="width=390">
<link rel="stylesheet" href="common.css">
<style>
.main{position:absolute;left:0;right:0;top:54px;bottom:0;overflow:auto;padding:0 0 40px}
.head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px 16px}
.brand{display:flex;align-items:center;gap:8px}
.brand .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,#C9A66B,#8a6a3a)}
.brand .name{font-size:20px;font-weight:700;letter-spacing:-.02em}
.sec{padding:16px 16px 8px;font-size:11px;letter-spacing:.14em;color:#C9A66B;font-family:ui-monospace,Menlo,monospace}
.row{display:flex;align-items:center;gap:14px;min-height:72px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.icon{width:40px;height:40px;border-radius:12px;background:#161617;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.85)}
.row b{display:block;font-size:16px}
.row small{display:block;font-size:12px;color:rgba(255,255,255,.55);margin-top:2px}
.note{
  margin:16px 16px 0;padding:12px 14px;border-radius:12px;
  background:rgba(201,166,107,.08);border:1px solid rgba(201,166,107,.22);
  font-size:12px;line-height:1.55;color:rgba(255,255,255,.72)
}
.note strong{color:#fff;font-weight:600}
.arow{display:flex;align-items:center;justify-content:space-between;min-height:52px;padding:0 16px;border-bottom:1px solid rgba(255,255,255,.08);font-size:15px}
.foot{padding:28px 16px 0;display:flex;flex-direction:column;gap:8px}
.foot a{font-size:12px;color:#C9A66B;text-decoration:underline;margin-right:14px}
.foot .copy{font-size:11px;color:rgba(255,255,255,.4)}
</style>
</head><body>
<div class="phone">
  <div class="status"><span class="time">9:41</span><span class="icons">■■▮ ▮▮</span></div>
  <div class="main">
    <div class="head">
      <div class="brand"><span class="mark"></span><span class="name serif">Journey Photo</span></div>
      <span style="font-size:20px;opacity:.9">✕</span>
    </div>
    <div class="sec">見る</div>
    <div class="row"><div class="icon">▦</div><div style="flex:1"><b class="serif">撮影地マップ</b><small>下の「マップ」タブへ移ります</small></div><span style="opacity:.3">›</span></div>
    <div class="row"><div class="icon">♡</div><div style="flex:1"><b class="serif">いいねした写真</b><small>ハートを押した写真 · 作者に届きます</small></div><span style="opacity:.3">›</span></div>
    <div class="row"><div class="icon">⚑</div><div style="flex:1"><b class="serif">保存した写真</b><small>しおりで保存 · 自分だけ</small></div><span style="opacity:.3">›</span></div>
    <div class="note">共同アルバム・プラン・トランク・キャンパーは、<strong>マイページ → 旅の記録</strong>の先頭チップからすぐ開けます（入口は1か所のまま）。</div>
    <div class="sec">アカウント</div>
    <div class="arow"><span>マイページ</span><span style="opacity:.3">›</span></div>
    <div class="arow"><span>設定</span><span style="opacity:.3">›</span></div>
    <div style="padding:16px 16px 0;color:rgba(255,255,255,.65);font-size:15px">ログアウト</div>
    <div class="foot">
      <div><a>利用規約</a><a>プライバシーポリシー</a></div>
      <div class="copy">Journey Photo · journey-photo.com</div>
    </div>
  </div>
  <div class="home-bar"></div>
</div>
</body></html>
