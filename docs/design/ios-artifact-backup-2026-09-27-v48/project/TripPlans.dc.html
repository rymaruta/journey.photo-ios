<html lang="ja">
<head>
<meta charset="utf-8">
<title>旅行プラン</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap">
<style>
body{margin:0;background:#000000;font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans','Noto Sans JP',system-ui,sans-serif;color:rgba(255,255,255,0.95);-webkit-font-smoothing:antialiased}

</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; color: rgba(255,255,255,0.95)">
<header style="position: absolute; left: 0; right: 0; top: 0; height: 104px; box-sizing: border-box; padding: 54px 8px 0; display: flex; align-items: center; justify-content: space-between; background: #000000; z-index: 3"><a href="MyPage.dc.html" aria-label="戻る" style="width: 44px; height: 44px; border-radius: 22px; background: transparent; color: #fff; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 5-7 7 7 7"></path></svg></a><div style="display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 0"><span style="font-size: 16px; font-weight: 600; color: #fff; white-space: nowrap">旅行プラン</span></div><span style="width: 44px"></span></header><sc-if value="{{hasItems}}" hint-placeholder-val="{{ true }}"><main style="position: absolute; left: 0; right: 0; top: 104px; bottom: 0px; overflow: hidden; box-sizing: border-box; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px"><p style="margin: 0; padding: 0 4px; flex-shrink: 0; font-size: 11px; line-height: 1.65; color: rgba(255,255,255,0.6)">旅行プラン <span style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace">4</span> 件</p><div style="display: flex; gap: 8px; flex-shrink: 0"><label style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.6)"><input type="text" placeholder="例: 冬のフィンランド" aria-label="旅行プランのタイトル" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font-family: inherit; font-size: 15px"></label><button aria-disabled="true" style="min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #B8955A; color: #07090a; font-size: 13px; font-weight: 600; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.5">作る</button></div><p style="margin: -6px 0 0; padding: 0 4px; flex-shrink: 0; font-size: 11px; line-height: 1.5; color: rgba(255,255,255,0.6)">「作る」は題を入力するまで無効です</p><a href="TripPlanDays.dc.html" style="border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; padding: 14px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.95); flex-shrink: 0"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; letter-spacing: 0.16em; color: {{accent}}">出発まで 00 日</span><span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; line-height: 1.3">[題]</span><span style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: rgba(255,255,255,0.82)">2026年11月3日 〜 2026年11月4日</span></span><span style="font-size: 13px; color: rgba(255,255,255,0.6); font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; white-space: nowrap">00 か所</span><span style="color: rgba(255,255,255,0.35); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></span></a><a href="TripPlanDays.dc.html" style="border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; padding: 14px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.95); flex-shrink: 0"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; line-height: 1.3">[題]</span><span style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: rgba(255,255,255,0.82)">2026年12月24日 〜 2026年12月25日</span></span><span style="font-size: 13px; color: rgba(255,255,255,0.6); font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; white-space: nowrap">00 か所</span><span style="color: rgba(255,255,255,0.35); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></span></a><a href="TripPlanDays.dc.html" style="border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; padding: 14px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.95); flex-shrink: 0"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; line-height: 1.3">[題]</span></span><span style="font-size: 13px; color: rgba(255,255,255,0.6); font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; white-space: nowrap">00 か所</span><span style="color: rgba(255,255,255,0.35); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></span></a><!-- 眉ラベル「出発まで 00 日」は「次の出発」の札1枚だけ（Main の合図と同じく出発が7日以内のとき。ここでは置き場として最も近い日付の札に付ける）。並びは出発日の近い順、日付の無いプラン、帰着済みの順 --><div style="border-radius: 16px; background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.08); box-sizing: border-box; display: flex; flex-direction: column; flex-shrink: 0"><a href="TripPlanDays.dc.html" style="padding: 14px; display: flex; align-items: center; gap: 12px; color: rgba(255,255,255,0.95)"><span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0"><span style="font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size: 18px; font-weight: 700; line-height: 1.3">[題]</span><span style="font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; font-size: 11px; color: rgba(255,255,255,0.82)">2026年9月12日 〜 2026年9月14日</span></span><span style="font-size: 13px; color: rgba(255,255,255,0.6); font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace; white-space: nowrap">00 か所</span><span style="color: rgba(255,255,255,0.35); display: flex"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 5 7 7-7 7"></path></svg></span></a><a href="TripBook.dc.html" style="min-height: 44px; margin: 0 14px; border-top: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: {{accent}}"><span style="flex-grow: 1">旅の一冊を見る</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"></path></svg></a></div><!-- F30: 帰着が過ぎ、同じ期間の一冊（TripBook 2026.09.12 — 09.14）があるときだけ「旅の一冊を見る」を出す。期間の重なりで結ぶだけで新しいデータは要らない --></main></sc-if>
<sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
<!-- F01: 空のとき（プラン0）。「無い」＋「埋め方」＋「押せる一手」。件数の 0 は出さない -->
<main style="position: absolute; left: 0; right: 0; top: 104px; bottom: 0px; overflow: hidden; box-sizing: border-box; padding: 16px 16px 24px; display: flex; flex-direction: column; gap: 14px"><div style="display: flex; gap: 8px; flex-shrink: 0"><label style="flex-grow: 1; min-width: 0; height: 44px; box-sizing: border-box; padding: 0 14px; border-radius: 12px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.06); display: flex; align-items: center; gap: 10px; color: rgba(255,255,255,0.6)"><input type="text" placeholder="例: 冬のフィンランド" aria-label="旅行プランのタイトル" style="flex-grow: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: #fff; font-family: inherit; font-size: 15px"></label><button aria-disabled="true" style="min-height: 44px; min-width: 44px; padding: 0 14px; border-radius: 999px; border: 0; background: #B8955A; color: #07090a; font-size: 13px; font-weight: 600; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: 0.5">作る</button></div><p style="margin: -6px 0 0; padding: 0 4px; flex-shrink: 0; font-size: 11px; line-height: 1.5; color: rgba(255,255,255,0.6)">「作る」は題を入力するまで無効です</p><section style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 48px 8px 8px; text-align: center"><h2 style="margin: 0; font-family: 'Shippori Mincho B1', 'Hiragino Mincho ProN', 'Yu Mincho', 'Noto Serif JP', serif; font-size: 20px; font-weight: 700; letter-spacing: 0.01em">旅行プランはまだありません</h2><p style="margin: 0; font-size: 13px; line-height: 1.7; color: rgba(255,255,255,0.72)">行きたい場所を保存すると、ここで日程に並べられます</p><a href="Search.dc.html" style="margin-top: 10px; height: 48px; padding: 0 24px; border-radius: 999px; background: rgba(255,255,255,0.92); color: #07090a; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600">撮影スポットを探す</a></section></main></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent": {"editor": "color", "default": "#C9A66B", "options": ["#C9A66B", "#F2A66B", "#FFFFFF"]}, "empty": {"editor": "boolean", "default": false, "section": "状態"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
const isEmpty = !!(this.props.empty ?? false);
return { accent: this.props.accent ?? '#C9A66B', isEmpty: isEmpty, hasItems: !isEmpty };
}
}
</script>
</body>
</html>
