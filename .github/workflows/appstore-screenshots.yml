# App Store 用の画面写真を、App Store Connect の「提出の準備中」の版に入れ替える（手で起動するだけ・2026-11-23・札 #604）。
#
# owner は iPhone しか無く、App Store Connect の Web は iPhone では画面写真の追加・削除ができない（owner 2026-11-23「仕組み作ろう」）。
# 絵は `ios-testflight.yml` の `storeShots: true` の回が非公開の S3 の `<run 番号>/store.tar` に置いたもの。
#
# - **既定は下見（apply=false）。** 何を消して何を上げるかをログに出すだけ。apply=true のときだけ変える
# - 相手にするのは指定の版で **状態が PREPARE_FOR_SUBMISSION のものだけ**。ほかの状態（配信中・審査中）なら赤で止まる
# - 触るのは iPhone の画面写真の組だけ（6.9・6.3 を入れ替え、6.5 以前の古い組は空にする）。メタデータ・提出には触らない
# - 🔴 公開リポジトリなので、絵はログ・成果物に出さない（#451）。成果物（artifact）は作らない
# 中身と組の振り分けは `Tools/asc-screenshots.py` の頭。手順は docs/APP_STORE_METADATA.md の「作り方」
#
# 名前は英字にしておく（非公開の置き場の run の印がワークフロー名から作られる決まり・`Tools/private-s3.sh`）
name: App Store screenshots

on:
  workflow_dispatch:
    inputs:
      run:
        description: "store.tar のある run 番号（ios-testflight.yml の storeShots の回）"
        required: true
        type: string
      version:
        description: "App Store Connect の版（例 1.1.119・状態が「提出の準備中」のもの）"
        required: true
        type: string
      apply:
        description: "true で入れ替える。false は下見（何を消して何を上げるかを出すだけ）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # 同じ版を2本同時に入れ替えない
  group: appstore-screenshots-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  screenshots:
    # apply は真偽でも文字（API から -f で 'true'）でも来る。'false' の文字を真と読まないよう、両方を名指しで比べる
    name: 画面写真を入れ替える（${{ (inputs.apply == true || inputs.apply == 'true') && '入れ替え' || '下見' }}）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # 非公開の置き場に OIDC で入る（`Tools/private-s3.sh`）。読む権限（s3:GetObject）が役割に要る
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: 画面写真を入れ替える
        env:
          RUN_KEY: ${{ inputs.run }}
          VERSION: ${{ inputs.version }}
          MODE: ${{ (inputs.apply == true || inputs.apply == 'true') && 'apply' || 'dry-run' }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CI_SHOTS_ROLE_ARN: ${{ secrets.CI_SHOTS_ROLE_ARN }}
          CI_SHOTS_BUCKET: ${{ secrets.CI_SHOTS_BUCKET }}
        run: bash Tools/asc-screenshots.sh "$RUN_KEY" "$VERSION" "$MODE"
