# 一時（main に入れない）: 測る間に枝に書いてしまった大きい控え（v2・3,976MB）を消す
name: 測る（一時）

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: 枝の v2 の控えを消す
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[]|"\(.ref) \(.key) version=\(.version) \(.created_at) \(.last_accessed_at) \(.size_in_bytes/1048576|floor)MB"'
