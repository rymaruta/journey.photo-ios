# 測るための一時のワークフロー（2026-11-11）。測り終えたら消す。控えは読むだけ
name: 測る（一時）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 測る
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Xcodeを選択
        run: bash Tools/select-xcode.sh
      - name: 控えを戻す
        uses: ./.github/actions/xcode-cache-restore
      - name: xcodegen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: 依存の図を解く（ふつう → Package.resolved に固定 → ふつう）
        run: |
          r() {
            n="$1"; shift
            s=$SECONDS
            xcodebuild -resolvePackageDependencies -project JourneyPhoto.xcodeproj -scheme JourneyPhoto -skipPackageUpdates \
              -skipPackagePluginValidation -skipMacroValidation "$@" > "/tmp/$n.log" 2>&1
            rc=$?
            echo "$n: $((SECONDS-s)) 秒・終わり ${rc}・取りに行った $(grep -cE 'Fetching|Cloning|Updating' "/tmp/$n.log") 行" | tee -a "$GITHUB_STEP_SUMMARY"
          }
          resolved=JourneyPhoto.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          r A_plain
          ls -la "$resolved" || true
          cp "$resolved" /tmp/Package.resolved
          rm -rf JourneyPhoto.xcodeproj && xcodegen generate > /dev/null
          mkdir -p "$(dirname "$resolved")" && cp /tmp/Package.resolved "$resolved"
          r B_pinned -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile
          tail -3 /tmp/B_pinned.log
          rm -rf JourneyPhoto.xcodeproj && xcodegen generate > /dev/null
          r C_plain_again
          s=$SECONDS
          mkdir -p "$(dirname "$resolved")" && cp /tmp/Package.resolved "$resolved"
          xcodebuild -project JourneyPhoto.xcodeproj -scheme JourneyPhoto ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -skipPackagePluginValidation -skipMacroValidation -skipPackageUpdates \
            -disableAutomaticPackageResolution -onlyUsePackageVersionsFromResolvedFile \
            -destination "platform=iOS Simulator,name=iPhone 17 Pro Max,arch=arm64" build-for-testing > /tmp/D.log 2>&1
          echo "D_build_pinned: $((SECONDS-s)) 秒・終わり $?・Swift $(grep -c 'SwiftCompile normal' /tmp/D.log) 件" | tee -a "$GITHUB_STEP_SUMMARY"
          grep -n "Resolve Package Graph\|Resolved source packages\|SwiftDriver JourneyPhoto \|TEST BUILD SUCCEEDED" /tmp/D.log | head
