# 一時（main に入れない）: 測る間に枝に書いてしまった大きい控え（v2・3,976MB）を消す
name: 測る（一時）

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  cleanup:
    name: 枝の v2 の控えを消す
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "前: $(( $(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" --jq '.active_caches_size_in_bytes') / 1048576 )) MB"
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100&ref=refs/heads/claude/pr-ui-sharded" \
            --jq '.actions_caches[] | select(.key | startswith("xcode-v2-")) | .id' | while read -r id; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/actions/caches/${id}" && echo "消した: ${id}"
          done
          echo "後: $(( $(gh api "repos/${GITHUB_REPOSITORY}/actions/cache/usage" --jq '.active_caches_size_in_bytes') / 1048576 )) MB"
          gh api "repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" --jq '.actions_caches[]|"\(.size_in_bytes/1048576|floor) MB \(.ref) \(.key[0:50])"'
