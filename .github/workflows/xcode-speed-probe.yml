# 測るための一時のワークフロー（2026-11-11・毎回のを速くする (a)〜(d) を1回で測る）。測り終えたら消す。
# 控えは読むだけ（書かない: 置き場 10GB から main の控えを追い出さないように）。「控えから戻した」状態は、
# DerivedData を別の場所へ写して戻す（ファイルの番号 inode が変わる）・ソースを書き直す、で同じにする
name: 測る（一時）

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: 測る
    runs-on: macos-15
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - name: Xcodeを選択
        run: bash Tools/select-xcode.sh
      - name: シミュレーターを起こす
        run: |
          DEVICE="$(python3 Tools/pick-simulator.py)"
          echo "DEVICE=$DEVICE" >> "$GITHUB_ENV"
          nohup bash -c "xcrun simctl boot '$DEVICE'; xcrun simctl bootstatus '$DEVICE' -b" > /tmp/boot.log 2>&1 &
      - name: 鍵
        run: |
          echo "XCODE_BUILD=$(xcodebuild -version | tr '\n' '-' | tr -d ' ')" >> "$GITHUB_ENV"
      - name: 鍵2
        run: echo "CACHE_KEY=xcode-deps-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('project.yml', 'Package.swift') }}" >> "$GITHUB_ENV"
      - name: 控えを戻す（main の今の形）
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.dSYM
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.app
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.xctest
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.xcresult
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Intermediates.noindex/ArchiveIntermediates
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
            xcode-deps-${{ runner.os }}-${{ env.XCODE_BUILD }}-
      - name: (a) 依存と組んだものだけにする（ほかを消す）・その大きさ
        run: |
          dd="$(ls -d "$HOME"/Library/Developer/Xcode/DerivedData/JourneyPhoto-* | head -1)"
          echo "DD=$dd" >> "$GITHUB_ENV"
          rm -rf "$HOME/Library/Caches/org.swift.swiftpm" "$dd/SourcePackages/repositories" "$dd/Build/Intermediates.noindex/ArchiveIntermediates"
          du -sh "$dd/SourcePackages" "$dd/Build" | tee -a "$GITHUB_STEP_SUMMARY"
          s=$SECONDS
          tar -C "$dd" -cf - SourcePackages Build | zstd -T0 -q | wc -c | awk '{printf "zstd に包んだ大きさ: %.0f MB\n", $1/1048576}' | tee -a "$GITHUB_STEP_SUMMARY"
          echo "包むのに $((SECONDS-s)) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: xcodegen
        run: |
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: 組む道具
        run: |
          cat > /tmp/build.sh <<'SH'
          set -uo pipefail
          name="$1"
          python3 Tools/source-mtime.py
          s=$SECONDS
          xcodebuild -project JourneyPhoto.xcodeproj -scheme JourneyPhoto ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -skipPackagePluginValidation -skipMacroValidation \
            -destination "platform=iOS Simulator,name=$DEVICE,arch=arm64" -showBuildTimingSummary \
            build-for-testing > "build/$name.log" 2>&1
          rc=$?
          echo "${name}: $((SECONDS-s)) 秒・終わり ${rc}・Swift を組んだ $(grep -c 'SwiftCompile normal' "build/$name.log") 件・パッケージを取りに行った $(grep -cE 'Fetching|Cloning|Updating https' "build/$name.log") 行" | tee -a "$GITHUB_STEP_SUMMARY"
          sed -n '/Build Timing Summary/,$p' "build/$name.log" | grep -E "seconds|Timing" | sort -t'|' -k2 -rn | head -12
          grep -E "Fetching|Cloning|Resolve Package|resolved source packages" "build/$name.log" | head -5
          grep -oE "SwiftCompile normal arm64 Compiling\\? [^ ]+" "build/$name.log" | head -5
          SH
          mkdir -p build
      - name: (a)(b) 組む 1 回目（消したあと・全部組み）
        run: bash /tmp/build.sh b1
      - name: (b) 控えから戻したのと同じ状態にする（DerivedData を写して戻す・ソースを書き直す）
        run: |
          s=$SECONDS
          ditto "$DD" "$DD.copy" && rm -rf "$DD" && mv "$DD.copy" "$DD"
          git ls-files -z | while IFS= read -r -d '' f; do [ -L "$f" ] || { cp -p "$f" "$f.tmp" && mv "$f.tmp" "$f"; touch "$f"; }; done
          rm -rf JourneyPhoto.xcodeproj && xcodegen generate > /dev/null
          echo "写して戻す: $((SECONDS-s)) 秒" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: (b) 組む 2 回目（中身は同じ）
        run: bash /tmp/build.sh b2
      - name: (b) 組む 3 回目（画面のファイルを1つ変えた）
        run: |
          echo "// probe" >> Sources/JourneyPhoto/Features/Settings/WhatsNewView.swift
          bash /tmp/build.sh b3
      - name: (b) 組む 4 回目（文言のファイルを1つ変えた）
        run: |
          sed -i '' 's/"Prefectures visited"/"Prefectures Visited"/' Sources/JourneyPhoto/Core/Text/VisitedMapText.swift
          bash /tmp/build.sh b4
      - name: 組む 5 回目（ソースの時刻を揃えない・今の作り）
        run: |
          git ls-files -z | xargs -0 touch
          s=$SECONDS
          xcodebuild -project JourneyPhoto.xcodeproj -scheme JourneyPhoto ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            -skipPackagePluginValidation -skipMacroValidation \
            -destination "platform=iOS Simulator,name=$DEVICE,arch=arm64" build-for-testing > build/b5.log 2>&1
          echo "b5（時刻を揃えない）: $((SECONDS-s)) 秒・Swift を組んだ $(grep -c 'SwiftCompile normal' build/b5.log) 件" | tee -a "$GITHUB_STEP_SUMMARY"
