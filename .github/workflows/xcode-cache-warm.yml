# Mac の控え（DerivedData・v3）を書く（2026-11-11・毎回のを速くする・控えが無い回を作らない）。テストは流さない。
#
# 毎回の（ios-quick.yml）は、main の控えから「変えたファイルだけ」組む（`.github/actions/xcode-cache-restore`）。
# 控えが古いほど組み直すファイルが増え、控えが無い回（Xcode が上がった・project.yml の依存が変わった）は依存
# （Amplify・aws-sdk-swift）を丸ごと組んで 30 分の上限を越える。そこで控えはここだけで書く:
#  - **main に入るたび**（push）: アプリの組んだものを新しくする（PR の回が組み直すのは PR で変えた分だけになる）
#  - **毎日 1 回、控えがあるかだけ見る**（schedule・Mac 1 分）: GitHub のランナーの Xcode が上がって鍵が変わったら、
#    PR の回より先にここで作り直す。あれば何もしない（テストは流さない。2026-11-11 owner「夜の定期のテストは置かない」とは別）
#  - **毎回のが控えに当たらなかったとき**（毎回のが workflow_dispatch で頼む）・手で（/mac-check の手順）
# 書くのは main だけ（枝・PR の控えは main の控えを置き場 10GB から追い出す）。控えは zstd で約 500MB（run 42996168684）
name: Mac の控えを書く

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  schedule:
    - cron: "41 18 * * *"
  workflow_dispatch:
    inputs:
      xcode:
        description: "組む Xcode の版（空ならいちばん新しいもの。毎回のが頼むときは、その台の版を渡す）"
        type: string
        default: ""

permissions:
  contents: read
  actions: read

# 🔴 **取り消さない・待ちは 1 本**（2026-11-11 確かめ役の指摘 1）。取り消すと、続けて頼まれた回が前の回を止め合って
# 控えが書かれ続けない。3 本目が来たら待っていた 2 本目が外れる（GitHub の決まり）ので、待ちは 1 本で足りる
concurrency:
  group: xcode-cache-warm-${{ github.ref }}
  cancel-in-progress: false

jobs:
  warm:
    name: 控えを書く
    # 🔴 **書くのは main だけ**（枝の控えは main の控えを置き場 10GB から追い出す。2026-11-11 に実際に追い出した）
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: macos-15
    # 控えが無いと依存を丸ごと組む（2026-11-11 run 43013029429: 組む 944 秒・Swift 3,271 件・回全体 17 分。前の run #8 は 50 分あまり）
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      - name: Xcodeを選択
        env:
          XCODE_VERSION: ${{ inputs.xcode }}
        run: bash Tools/select-xcode.sh "${XCODE_VERSION:-}"

      - name: 控えを戻す
        id: cache
        uses: ./.github/actions/xcode-cache-restore

      # 毎日の回・頼まれた回は「この Xcode と依存の版の控え（鍵の頭が同じ v3）があるか」だけ見て、あれば終わる。
      # main に入った回（push）は、アプリの組んだものを新しくするためにいつも組む
      - name: この Xcode の控えがあるか（毎日の回・頼まれた回）
        id: need
        env:
          EVENT: ${{ github.event_name }}
          KEY: ${{ steps.cache.outputs.key }}
          EXACT: ${{ steps.cache.outputs.exact }}
        run: |
          if [ "$EVENT" != "push" ] && [ "$EXACT" = "true" ]; then
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "今の Xcode の控え（${KEY}）があるので書かない" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Xcodeプロジェクトを生成
        if: ${{ steps.need.outputs.build == 'true' }}
        run: |
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          xcodegen generate

      - name: 組む（シミュレータ向け・テストの品まで）
        if: ${{ steps.need.outputs.build == 'true' }}
        run: |
          s=$SECONDS
          XCODE_LOG=/tmp/xcodebuild-warm.log bash Tools/xcode-test.sh build > /dev/null
          echo "組む（${XCODE_BUILD:-?}）: $((SECONDS - s)) 秒・Swift を組んだ $(grep -c 'SwiftCompile normal' /tmp/xcodebuild-warm.log) 件（控え ${{ steps.cache.outputs.hit }}）" | tee -a "$GITHUB_STEP_SUMMARY"

      # 🔴 **書く前に、控えに入れないものを消す**（path の `!` の行は効かなかった・`.github/actions/xcode-cache-restore` の注記）。
      # SwiftPM の置き場の写し（repositories 3.2GB）と Archive の中間物（1.3GB）。消しても依存を取りに行かずに組めた（run 42996168684）
      - name: 控えに入れないものを消す
        if: ${{ steps.need.outputs.build == 'true' }}
        run: |
          dd="$(ls -d "$HOME"/Library/Developer/Xcode/DerivedData/JourneyPhoto-* | head -1)"
          rm -rf "$dd/SourcePackages/repositories" "$dd/Build/Intermediates.noindex/ArchiveIntermediates"
          find "$dd/Build/Products" \( -name '*.dSYM' -o -name '*.xcresult' \) -prune -exec rm -rf {} + 2>/dev/null || true
          du -sh "$dd/SourcePackages" "$dd/Build" | tee -a "$GITHUB_STEP_SUMMARY"

      # 🔴 path の並びは `.github/actions/xcode-cache-restore` の v3 と同じ（違うと当たらない・check-config.py が見る）
      - name: 控えを書く
        if: ${{ steps.need.outputs.build == 'true' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v6
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
          key: ${{ steps.cache.outputs.key }}-${{ github.run_id }}
