# Journey Photo Release Center v1
# Uploads: ios-testflight.yml (signing, Archive, upload only; it runs no tests).
# Verification (2026-11-11 owner "毎回のと ガチガチので"): ios-quick.yml by default (Mac-only unit tests,
# SmokeTests, UI tests related to the branch diff, plus ui_scope names), or ios-full.yml when ui_scope is
# "all" (every unit and UI test on 4 Macs; only for bugs whose cause is unknown).
name: Release Center

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode"
        type: choice
        options:
          - verify
          - testflight-internal
          - testflight-external
        default: verify
      ui_scope:
        description: "Verification: empty = quick (diff-related UI) / test or screen names to add / all = full (unknown-cause bugs only). Uploads run no tests."
        type: string
        default: ""
      priority_tests:
        description: "Full verification only: run these UI tests first (comma separated)"
        type: string
        default: ""
      confirm_release:
        description: "Required for TestFlight upload; check only after reviewing the target commit"
        type: boolean
        default: false

permissions:
  # The called TestFlight build job creates release tags (testflight/<version>).
  # Reusable workflows cannot elevate the caller token permissions.
  contents: write

# No automatic uploads. Releases can target any branch, with explicit confirmation.
jobs:
  plan:
    name: Validate settings and publish execution plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.validate.outputs.release }}
      external: ${{ steps.validate.outputs.external }}
      screens: ${{ steps.validate.outputs.screens }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate inputs
        id: validate
        env:
          MODE: ${{ inputs.mode }}
          UI_SCOPE: ${{ inputs.ui_scope }}
          FIRST: ${{ inputs.priority_tests }}
          CONFIRM: ${{ inputs.confirm_release }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          release=false
          external=false
          screens="${UI_SCOPE:-}"
          case "$MODE" in
            verify)
              if [ "$CONFIRM" = "true" ]; then
                echo "::error::confirm_release is only valid for TestFlight modes"
                exit 1
              fi
              ;;
            testflight-internal|testflight-external)
              release=true
              if [ "$MODE" = "testflight-external" ]; then external=true; fi
              if [ "$BRANCH" != "main" ]; then
                echo "::warning::Releasing from $BRANCH (not main). Review the commit SHA carefully."
              fi
              if [ "$CONFIRM" != "true" ]; then
                echo "::error::Select confirm_release to explicitly authorize upload"
                exit 1
              fi
              if [ -n "$FIRST" ]; then
                echo "::warning::priority_tests is ignored for uploads; uploads run no tests"
              fi
              echo "::notice::TestFlight uploads do not run Xcode tests (ios-quick.yml / ios-full.yml verify commits)."
              screens=none
              ;;
            *) echo "::error::Unknown mode: $MODE"; exit 1 ;;
          esac
          if [ "$release" = "false" ]; then
            python3 Tools/pick-ui-tests.py "$screens" >/tmp/release-center-ui-plan.txt
          fi
          {
            echo "release=$release"
            echo "external=$external"
            echo "screens=$screens"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Journey Photo Release Center"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Mode | \`$MODE\` |"
            echo "| Branch | \`$BRANCH\` |"
            echo "| Commit | \`$SHA\` |"
            echo "| UI tests | \`$screens\` |"
            echo "| Upload authorized | \`$CONFIRM\` |"
            echo ""
            echo "Uploads: ios-testflight.yml (no tests). Verification: ios-quick.yml, or ios-full.yml when ui_scope is all."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate Swift references and project configuration
        run: |
          set -euo pipefail
          python3 Tools/check-cross-imports.py Sources Tests
          python3 Tools/check-config.py

  # 2026-11-11 owner「毎回のと ガチガチので」作り替え: TestFlight の回（ios-testflight.yml）はテストを流さない。
  # verify は ui_scope が all ならガチガチの（ios-full.yml）、ほかは毎回の（ios-quick.yml・ui_scope を名指しとして足す）
  pipeline:
    name: TestFlight pipeline
    needs: plan
    if: ${{ needs.plan.outputs.release == 'true' }}
    uses: ./.github/workflows/ios-testflight.yml
    with:
      submit: true
      betaReview: ${{ needs.plan.outputs.external == 'true' }}
    secrets: inherit

  verify-quick:
    name: Xcode verification (quick)
    needs: plan
    if: ${{ needs.plan.outputs.release != 'true' && needs.plan.outputs.screens != 'all' }}
    # actions: write は、静的な検査が落ちたときに回を止めるため（ios-quick.yml の static）
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/ios-quick.yml
    with:
      screens: ${{ needs.plan.outputs.screens }}

  verify-full:
    name: Xcode verification (full)
    needs: plan
    if: ${{ needs.plan.outputs.release != 'true' && needs.plan.outputs.screens == 'all' }}
    uses: ./.github/workflows/ios-full.yml
    with:
      first: ${{ inputs.priority_tests }}
