# 単体テストと UI テストを、別々の Mac に分けて同時に流す（再利用のワークフロー・`workflow_call` だけ）。
#
# 呼ぶのは `ios-full.yml`（ガチガチの・手で押したときだけ）だけ（2026-11-11 owner「毎回のと ガチガチので」作り替え）。
# 2026-10-31（#429）に ios-testflight.yml の中に作った組を、2026-11-10 にここへ移した（中身は変えていない）。
# 毎回（PR・枝の確かめ）は `ios-quick.yml`、TestFlight に上げる回はテストを流さない
# **写しを作らない。** 振り分け（`Tools/pick-ui-tests.py --plan`・`Tools/ui-test-times.json`）・品の受け渡し
# （`Tools/test-products.py`・`.github/actions/mac-test-part`）・印はここだけに書く。`Tools/check-config.py` が見張る
#
# ===========================================================================================
# run 778（41187923424）の実測: 全部の回 128 分 = 控え 2 分・組む 6 分・単体 8 分・UI 109 分（1台で1本ずつ）。
#
#   テストの品を組む（1台・組むのは1回だけ）
#     ├─ 単体テスト（1台）           ┐ 同時に流す。どちらかが落ちたら、UI の分けた組は走らない
#     └─ UI の先に流す分（1台）      ┘ （枝で変えた画面のテスト＋起動の見張り。単体より短く収める）
#          └─ UI の分けた組 1〜4（4台・同時）
#               └─ まとめ（Linux・「Mac のテストが通った」の印）
#
# - **組んだ品は成果物で渡す**（各台で組み直さない）。各台で組み直すと控えから戻す 2 分＋組む 6 分（run 778）
# - **振り分けは1本ずつの実際の時間から**（`Tools/ui-test-times.json`・run 778 の全文ログから作った）。
#   長いものから順に、いちばん軽い組に入れる。表に無い新しいテストは表の中央の値で見積もる。
#   最後の組は「全部から、ほかの組と先に流した分を抜いた残り」なので、読み落としたテストも必ずどこかで流れる
# - **先に流した分は分けた組から抜く**。テストの本数は1本も変わらない（足さない・減らさない）
# - 単体テストは今までどおり1回。単体が落ちたら UI の分けた組には進まない
# - この中で同時に動く Mac は多いときで4台（分けた組）。2026-11-11 判断: 3→4 組（run 42920469610 の UI 合計 160.4 分・
#   分けた組は1台 約 53〜62 分だった）。全部の回は同時に1本（`ios-full.yml` の concurrency）。
#   分けた組を単体の終わりを待たずに走らせる案は、単体・先に流す分・4組で6台になり上限（5台）を超えるので入れない
# ===========================================================================================
name: テストを分けて流す

on:
  workflow_call:
    inputs:
      # 先に流す UI テスト（`screens` と同じ書き方）。空なら枝の差分から `pick-ui-tests.py --plan` が選ぶ
      first:
        type: string
        default: ""
      # 枝の差分を読む比べ方（GitHub の compare の口の `<元>...<先>`）。空なら `main...<この回の sha>`。
      # PR の回は `<base の sha>...<head の sha>` を渡す（PR の回の sha はマージの試しのコミットなので、こちらで比べる）
      compare:
        type: string
        default: ""

permissions:
  contents: read

jobs:
  test-build:
    name: テスト用ビルドを準備
    runs-on: macos-15
    # 控えが外れて依存を丸ごと組むと50分を超える（run #8）
    timeout-minutes: 90
    outputs:
      xcode: ${{ steps.xcode.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # **何を先に流し、どう分けるかを最初に決める**（`Tools/pick-ui-tests.py --plan`）。
      # 枝の差分は GitHub の比べる口（既定は main...この sha）から読む。読めなければ起動の見張りだけを先に流す。
      # 組の数（4）は下の `ui` の matrix と揃える（`Tools/check-config.py` が見る）
      - name: 優先UIテストと分割対象を決定
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
          COMPARE: ${{ inputs.compare }}
        run: |
          set -euo pipefail
          compare="${COMPARE:-main...${GITHUB_SHA}}"
          echo "比べ方: ${compare}"
          if ! gh api -H "Accept: application/vnd.github.diff" \
                 "repos/${GITHUB_REPOSITORY}/compare/${compare}" > /tmp/branch.diff; then
            echo "::warning::枝の差分が読めませんでした。先に流すのは起動の見張りだけにします"
            : > /tmp/branch.diff
          fi
          echo "枝の差分: $(grep -c '^diff --git' /tmp/branch.diff || true) ファイル"
          {
            echo "### UI テストの割り振り（4台に分けて同時に流す）"
            python3 Tools/pick-ui-tests.py --plan 4 build/ui-plan "${FIRST:-}" /tmp/branch.diff
          } >> "$GITHUB_STEP_SUMMARY"
          cat build/ui-plan/plan.md
          for f in build/ui-plan/*.txt; do echo "== $f"; cat "$f"; done

      - name: Xcodeを選択
        id: xcode
        run: bash Tools/select-xcode.sh

      # 控え（v2・依存と組んだものだけ）を戻し、ソースの時刻を中身から揃える（`.github/actions/xcode-cache-restore`）
      - name: 控えを戻す
        id: cache
        uses: ./.github/actions/xcode-cache-restore

      - name: Xcodeプロジェクトを生成
        run: |
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "xcodegen はインストール済みのため再インストールしません"
          fi
          xcodegen generate

      - name: 組む（本物の SwiftUI で型検査される最初の機会）
        run: |
          set -euo pipefail
          mkdir -p build/logs
          XCODE_LOG=build/logs/xcodebuild-build.log bash Tools/xcode-test.sh build

      - name: ビルド成果物を圧縮
        run: |
          set -euo pipefail
          products="$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 3 -type d -path '*/JourneyPhoto-*/Build/Products' | head -1)"
          python3 Tools/test-products.py pack "$products" build/test-products.tar
          ls -la build/test-products.tar

      # tar は自分で包んである（成果物の zip ではファイルの実行の権限が落ちるため）。縮める手間は軽くする
      - name: ビルド成果物をアップロード
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: |
            build/test-products.tar
            build/ui-plan
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

  pre:
    name: ${{ matrix.part == 'unit' && '単体テスト' || 'UI テスト（先に流す分・変えた画面）' }}
    needs: test-build
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      # 片方が落ちても、もう片方は最後まで流す（どちらの失敗も1回で見える）
      fail-fast: false
      matrix:
        part: [unit, first]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mac-test-part
        with:
          part: ${{ matrix.part }}
          xcode: ${{ needs.test-build.outputs.xcode }}

  ui:
    name: 分割UIテスト（${{ matrix.part }}/4）
    # 単体テストと先に流す分が両方とも通ったときだけ（どちらかが落ちたら skipped）
    needs: [test-build, pre]
    runs-on: macos-15
    # 1台あたりの見積もりは約 34 分。1本ごとの上限（Tools/xcode-test.sh）に当たる詰まりが続いても抜けられる長さ
    timeout-minutes: 90
    strategy:
      # 1つの組が落ちても、ほかの組は最後まで流す（前の1台の回も、1本落ちても残りを全部流していた）
      fail-fast: false
      matrix:
        part: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/mac-test-part
        with:
          part: ${{ matrix.part }}
          xcode: ${{ needs.test-build.outputs.xcode }}

  # 結果を読むだけなので Linux（2026-11-10 判断: 前は ios-testflight.yml の「まとめ」の Mac の上で付けていた。
  # Mac を1台減らす）。**どれかが落ちたら、この job も落とす**——呼ぶ側（ios-full.yml）が、呼んだ回の結果をそのまま読めるように
  result:
    name: 分割テストの結果を集約
    needs: [test-build, pre, ui]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 分割テスト結果を確認
        env:
          BUILD: ${{ needs.test-build.result }}
          PRE: ${{ needs.pre.result }}
          UI: ${{ needs.ui.result }}
        run: |
          {
            echo "### 分割テストの結果"
            echo "- テスト用ビルド: ${BUILD} / 単体と先に流す分: ${PRE} / 分けた組: ${UI}"
            echo "各MacジョブのSummaryに成功・失敗と理由を記録しています。公開Artifactへxcresult・画面画像は転送しません。"
          } >> "$GITHUB_STEP_SUMMARY"

      # 🔴 **「PR の検証」が数える印**（`ios-quick.yml` の `tested` が数える。毎回のの門も同じ名前の段を付ける）。単体・先に流す分・
      # 分けた組の全部が通った回だけ success。分けて流す回はいつも絞らない（呼ぶ側が全部の回だけ呼ぶ）。
      # `ios-quick.yml` の `tested` は ios-quick.yml・ios-full.yml の回の job（呼んだこの組の job も含む）からこの名前の段を探す
      - name: Mac のテストが通った（PR の検証が数える印）
        if: ${{ needs.test-build.result == 'success' && needs.pre.result == 'success' && needs.ui.result == 'success' }}
        run: echo "単体テストと UI テスト（先に流す分と分けた組 4つ）を絞らずに全部流し、通りました"

      - name: どれかが落ちたら落とす
        if: ${{ !(needs.test-build.result == 'success' && needs.pre.result == 'success' && needs.ui.result == 'success') }}
        run: |
          echo "::error::分けて流したテストのどれかが通っていません（上のまとめ）"
          exit 1
