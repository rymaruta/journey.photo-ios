# 夜の全部の回（main の UI テストを1日1回、全部流す）。
#
# 2026-11-11 owner「推奨で」（CLAUDE.md「Mac のテストは絞って回し、全部は夜に1日1回」・PR #528）:
# **マージの前（PR の検証）は 単体（全部）＋変えた画面の UI＋起動の見張り だけ。全部の UI テストは main を夜に1日1回。**
#
# - 流すのは `ios-testflight.yml` の上げない回（submit=false・screens=all）。中身は枝の確認の全部の回と同じで、
#   別々の Mac に分けて流す（`mac-sharded-tests.yml`・組む → 単体＋先に流す分 → 分けた組 3 台・Archive と合わせて最大4台）
# - **時刻は UTC 17:37（日本時間 2:37）**。cron の `CRON_TZ` は GitHub では使えない。日本の昼と、上げる回の多い時間を避ける
# - **前の夜と同じ sha なら流さない**（main が動いていない夜に Mac を4台使わない）。手で流すときは `force` で流せる
# - **落ちたら札（Issue）を立てる**: 題に日付と落ちたテストの名前。同じ日の札が開いていれば、そこにコメントを足す
#   （翌朝いちばんに札から直す。推定で直さない決まりはそのまま）
name: 夜の全部の回

on:
  schedule:
    - cron: "37 17 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "前の夜と同じコミットでも流す"
        type: boolean
        default: false

# 呼ぶ `ios-testflight.yml` の `build` の job が contents: write を求める（再利用のワークフローは呼ぶ側の権限を
# 超えられない）。上げない回なので、版の印も絵も書かない。ここでは既定を読むだけにして、要る job だけ開ける
permissions:
  contents: read

# 夜の回は同時に1本だけ（重ねて Mac を8台使わない）。後から来た回は待つ
concurrency:
  group: ios-nightly
  cancel-in-progress: false

jobs:
  decide:
    name: 流すかを決める（前の夜と同じコミットか）
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.look.outputs.run }}
    steps:
      - name: 前の夜を見る
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
          EVENT: ${{ github.event_name }}
        run: |
          # **読めなければ流す側に倒す**（`-e` を付けない）
          set -uo pipefail
          run=true
          reason="前の夜の回が見つからない"
          if [ "${FORCE:-false}" = "true" ]; then
            reason="手で force を付けて流した"
          else
            # 前の夜 = この回より前の、テストまで進んだ（全部の回の job が skipped でも cancelled でもない）いちばん新しい回
            ids="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ios-nightly.yml/runs?branch=${GITHUB_REF_NAME}&status=completed&per_page=20" \
                     --jq ".workflow_runs[] | select(.id != ${GITHUB_RUN_ID}) | \"\(.id) \(.head_sha)\"" 2>/dev/null || true)"
            while read -r id sha; do
              [ -n "${id:-}" ] || continue
              ran="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" \
                       --jq '[.jobs[] | select(.name | startswith("全部の回")) | select(.conclusion == "success" or .conclusion == "failure")] | length' 2>/dev/null || echo 0)"
              if [ "${ran:-0}" -gt 0 ]; then
                if [ "$sha" = "$GITHUB_SHA" ]; then
                  run=false
                  reason="前の夜（run ${id}）と同じコミット ${sha}"
                else
                  reason="前の夜（run ${id}）は ${sha}。コミットが変わった"
                fi
                break
              fi
            done <<< "$ids"
          fi
          echo "流す: ${run}（${reason}）"
          {
            echo "### 夜の全部の回"
            echo "- コミット: ${GITHUB_SHA}（${EVENT}）"
            echo "- 流す: ${run}（${reason}）"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "run=${run}" >> "$GITHUB_OUTPUT"

  full:
    name: 全部の回
    needs: decide
    if: ${{ needs.decide.outputs.run == 'true' }}
    # `ios-testflight.yml` の `build` の job（contents: write）を呼ぶのに要る。上げない回なので書くものは無い
    permissions:
      contents: write
    uses: ./.github/workflows/ios-testflight.yml
    with:
      submit: false
      screens: all
    secrets: inherit

  # 🔴 **落ちたら札を立てる**（題に日付と落ちたテストの名前）。権限は札を書く（issues: write）と、
  # 落ちた job のログを読む（actions: read）だけ
  report:
    name: 落ちたら札を立てる
    needs: [decide, full]
    if: ${{ always() && needs.decide.outputs.run == 'true' && needs.full.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      issues: write
    steps:
      - name: 札を立てる
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          day="$(TZ=Asia/Tokyo date +%Y-%m-%d)"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          : > /tmp/failed.txt
          : > /tmp/jobs.txt
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' > /tmp/jobs.txt || true
          while IFS=$'\t' read -r id name; do
            [ -n "${id:-}" ] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${id}/logs" 2>/dev/null \
              | grep -oE "Test Case '-\[[A-Za-z0-9_]+\.[A-Za-z0-9_]+ [A-Za-z0-9_]+\]' failed" \
              | sed -E "s/Test Case '-\[[A-Za-z0-9_]+\.([A-Za-z0-9_]+) ([A-Za-z0-9_]+)\]' failed/\1\/\2/" >> /tmp/failed.txt || true
          done < /tmp/jobs.txt
          sort -u /tmp/failed.txt -o /tmp/failed.txt
          count="$(grep -c . /tmp/failed.txt || true)"
          if [ "${count:-0}" -gt 0 ]; then
            names="$(head -3 /tmp/failed.txt | paste -sd ',' - | sed 's/,/, /g')"
            [ "$count" -gt 3 ] && names="${names} ほか$((count - 3))本"
          else
            names="テストの名前は取れず（組む・環境の失敗の見込み。ログを見る）"
          fi
          title="夜の全部の回が落ちた ${day}: ${names}"
          {
            echo "main の夜の全部の回（UI テストを全部）が落ちました。"
            echo
            echo "- 回: ${run_url}"
            echo "- コミット: ${GITHUB_SHA}"
            echo "- 落ちた job:"
            sed 's/^[0-9]*\t/  - /' /tmp/jobs.txt
            echo "- 落ちたテスト（${count:-0}本）:"
            sed 's/^/  - /' /tmp/failed.txt
            echo
            echo "推定で直さない（CLAUDE.md）。落ちた値・記録で原因を確かめてから直し、次の TestFlight で出し直す。"
          } > /tmp/body.md
          cat /tmp/body.md
          # 同じ日の札が開いていれば、そこへ足す（同じ夜の流し直しで札を増やさない）
          existing="$(gh api "repos/${GITHUB_REPOSITORY}/issues?state=open&per_page=100" \
                        --jq ".[] | select(.title | startswith(\"夜の全部の回が落ちた ${day}\")) | .number" 2>/dev/null | head -1)"
          if [ -n "$existing" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/issues/${existing}/comments" -f body="$(cat /tmp/body.md)" > /dev/null
            echo "札 #${existing} にコメントを足しました" >> "$GITHUB_STEP_SUMMARY"
          else
            number="$(gh api "repos/${GITHUB_REPOSITORY}/issues" -f title="$title" -f body="$(cat /tmp/body.md)" \
                        -f 'labels[]=不具合' -f 'labels[]=場所: iOS' --jq .number)"
            echo "札 #${number} を立てました: ${title}" >> "$GITHUB_STEP_SUMMARY"
          fi
