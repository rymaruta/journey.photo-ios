# PR の検証（Linux の部分）: 静的な検査と、模型（Shims）に向けた単体テスト。
#
# 2026-11-11 owner「毎回のと ガチガチので」作り替え: 本物の Xcode（Mac）でのビルドとテストは
# `ios-quick.yml`（毎回の・PR で同時に走る・必須のチェックの名前「Xcode のビルドとテスト（シミュレータ）」と
# 「Mac でテスト済み」の数え方はそちら）。全部の単体と UI は `ios-full.yml`（ガチガチの・手で押したときだけ）。
# ここの「単体テスト（Linux・模型）」が単体の全部（5,352 件）を毎回流し、Mac の毎回のは Linux に無いものだけを流す
#
# 費用: このリポジトリは**公開**なので、GitHub の標準ランナーは無料。非公開に変えたら `ios-quick.yml` の
# `pull_request` を見直すこと（`ios-testflight.yml` の冒頭の「private だと分数が10倍」）。
#
# 無駄に回さない工夫:
#  - 同じ PR に押し直したら、前の回は止める（`concurrency`）
#  - 文書だけの変更では回さない（`paths-ignore`）
name: PR の検証

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # 構文・参照・import の組・設定（数秒）。Web 版との突き合わせは、
  # `photo-gallery` が非公開で読めないので「見ていない」と出して飛ばす
  checks:
    name: 静的な検査
    needs: scope
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.scope.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/static-checks
        with:
          swift: ${{ (github.event_name != 'pull_request' || needs.scope.outputs.app_changed != 'false') && 'true' || 'false' }}

  # ワークフローだけの変更ではアプリのソース・テストが変わらない。
  # GitHub Actions の設定を検査する静的チェックだけで済ませ、Mac を起動しない。
  scope:
    name: アプリ変更の有無
    # 差分確認に全履歴は不要。PRのマージコミットとbaseだけ取得する。
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.diff.outputs.app_changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: 差分を確認
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatchなどPR以外では差分が無いので必ず全検証。決め方は `Tools/app-changed.sh`（ios-quick.yml と同じ）
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "app_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(bash Tools/app-changed.sh "$BASE_SHA")"
          echo "app_changed=${changed}" >> "$GITHUB_OUTPUT"
          if [ "$changed" = "false" ]; then
            echo "ワークフロー・文書だけの変更: Linux 単体テストを省略" >> "$GITHUB_STEP_SUMMARY"
          fi

  # 模型（Shims/）に向けたビルドと単体テスト。手元の verify.sh と同じもの。
  # 公式の Swift のイメージで回すので、外部の action は使わない
  linux-tests:
    name: 単体テスト（Linux・模型）
    needs: scope
    if: ${{ needs.scope.outputs.app_changed != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.0.3-noble
    env:
      # 🔴 **落ちたときの書き出しを止める**（2026-10-03・run 1）。テストが落ちると Swift は
      # 呼び出しの積み重なりを書き出そうとするが、コンテナの中ではそこで止まり、
      # **30分の時間切れまで何も出さずに待った**（手元では1秒で書き出して終わる）。
      # 落ちた事実は終了コードで十分に分かる
      SWIFT_BACKTRACE: enable=no
    steps:
      - uses: actions/checkout@v7
      # **控え（actions/cache）は使わない。** Package に外部の依存は無く、効くのは
      # 自分のコードの差分ビルドだけ（初回3分弱）。1回 280MB をコミットごとに積むと
      # 控えの上限（10GB）を押し、TestFlight が頼る macOS の依存の控え（いちばん高い）
      # を追い出しかねない
      - name: ビルド
        run: swift build --build-tests
      # **並列にしない。** 通信の差し替え（`StubProtocol`）はプロセス全体で1つなので、
      # 並列で回すと別のテストの応答を拾って揺れる。結果のファイル（xunit）は並列の
      # ときしか出ないので、ログをそのまま残す
      # 手元では全件15秒ほど。**止まったら10分で切る**（30分待たない）
      - name: テスト
        shell: bash
        timeout-minutes: 10
        run: |
          set -o pipefail
          mkdir -p build
          swift test --skip-build 2>&1 | tee build/linux-tests.log | grep -E "error|failed|Executed [0-9]+ tests" | tail -n 60
      - name: テストの結果を残す
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: linux-tests
          path: build/linux-tests.log
          retention-days: 14
          if-no-files-found: ignore
