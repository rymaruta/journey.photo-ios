# TestFlight に上げる（GitHub Actions・macOS ランナー）。
#
# **公開リポジトリでだけ回す想定。** macOS ランナーは private だと
# **分数が10倍**で課金され、枠は owner のアカウント共通
# ——`photo-gallery` のデプロイ（毎回18分）が何回分も消える。
# CLAUDE.md が「枠切れ＝何も出せなくなる」と書いている状況そのもの
# （2026-08 に実際に20日間止まっている）。public なら標準ランナーは無料。
#
# **Mac は要らない。** 証明書もプロファイルも、App Store Connect の API キーから
# `codemagic-cli-tools`（Codemagic が公開している CLI・pip で入る）が作る。
# Codemagic の設定（`codemagic.yaml`）も残してあるので、どちらでも回せる。
name: TestFlight

on:
  workflow_call:
    inputs:
      submit:
        type: boolean
        default: false
      betaReview:
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      submit:
        description: "TestFlightに配信する"
        type: boolean
        default: true
      betaReview:
        description: "外部テストの審査も申請する"
        type: boolean
        default: false

# 🔴 **TestFlight に上げる回は同時に1本だけ**（2026-10-04）。2本が同時に走ると、
# どちらも `Tools/next-marketing-version.sh` で同じ版を決め、**同じ版が2つ上がる**
# （2026-10-03: run 326 と 327 がどちらも 1.0.63 になった。CLAUDE.md「同じ版のまま出さない」）。
# 2本目は1本目が版の印（`testflight/<版>`）を付け終わるまで待ち、次の版を決める。
# 止めはしない（`cancel-in-progress: false`）。上げない回（submit=false）は版を決めないので、
# 回ごとの組にして待たせない。
# GitHub の決まりで、待てるのは1本だけ——3本目を流すと、待っていた2本目は取り消される
concurrency:
  group: testflight-${{ inputs.submit && 'upload' || github.run_id }}
  cancel-in-progress: false

# **渡していない権限は漏らせない**（photo-gallery の IAM-3 と同じ方針）。
# checkout に要るのは読み取りだけ。
permissions:
  contents: read

env:
  BUNDLE_ID: com.journeyphoto.JourneyPhoto

jobs:
  build:
    # **絵を置く枝（`screenshots`）へ押すのに書き込みが要る。**
    # 既定は上の `permissions` のとおり読み取りだけ。ここだけ開ける
    permissions:
      contents: write
    # **`macos-latest` に固定しない。** ランナーの既定 Xcode が上がると
    # 挙動が変わるので、上げるときは意図して上げる
    runs-on: macos-15
    # **初回は控えが無く、依存を丸ごと組む。** Amplify →
    # aws-sdk-swift → smithy-swift はテストの段だけで50分を超えた
    # （run #8）。60分で切ると `actions/cache` の後片付けまで
    # 巻き添えで止まり、**次の回もまた冷たい状態から始まる**。
    # 一度でも最後まで通せば、以後は控えから戻って短くなる
    # 2026-10-22: 画面の試験が 104 分を超える日があり、120 分では打ち切られる（ios-pr.yml と同じ理由）
    # 2026-10-31（#429）: 上げる回で tests=true にすると、ここで UI テストを1台で全部流す（約 130 分）。
    # 続く Archive・上げるまで入れると 160 分に当たる（run 788 は Archive の途中で cancelled）。
    # この組だけ上限を延ばす（上げる回の流れは変えない・止めもしない。理由は「どこまで流すかを決める」の注記）
    timeout-minutes: 160

    steps:
      - uses: actions/checkout@v7

      # **依存の作り直しに毎回30分以上かかる。**
      # Amplify → aws-sdk-swift → smithy-swift は桁違いに大きく、
      # 素のランナーでは丸ごと組み直す。落としてきたソースと、組んだ
      # 中間生成物を控える（Xcode は古くなったものを自分で捨てる）。
      #
      # **鍵に Sources を含めない。** 含めると1文字直すたびに控えが
      # 外れて、いちばん高い依存のビルドからやり直しになる
      # 控えの鍵に混ぜる（Xcode が変わったら作り直す）
      # **いちばん先に見る。** 以前はテストの**あと**に置いていたので、
      # 秘密が1つ足りないだけの回でも**11分待たないと分からなかった**
      # （run 66 がそれ——TestFlight に上げるつもりで流して、11分後に
      # 「署名から先は飛ばしました」だけが残った）。何が足りないかは
      # **30秒で**分かるべきで、テストの結果とは何の関係も無い。
      #
      # **秘密がまだ無くてもテストまでは回す**（この節の元の意図）。
      # App Store Connect の API キーは人が画面から落としてくるもので、
      # 揃う前にも「本物の SwiftUI で通るか」を見たい。揃っていない回は
      # 署名から先を飛ばし、**緑で終わらせる**（赤にすると
      # 「コンパイルが通ったのか」が読み取れなくなる）
      - name: 署名用Secretsを確認
        id: secrets
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ISSUER:-}" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "${KEY_ID:-}" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "${KEY:-}" ]    || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -n "${CERT:-}" ]   || missing="$missing CERTIFICATE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "### 署名から先は飛ばしました" >> "$GITHUB_STEP_SUMMARY"
            echo "足りない Secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            # **二重引用符の中で逆引用符を使わない**（コマンドとして走る。
            # `setup-private-delivery.sh` で一度踏んだ）。単引用符で出す
            echo '（docs/GITHUB_ACTIONS.md の手順1〜3）' >> "$GITHUB_STEP_SUMMARY"
            # **「上げる」つもりで流した回は、緑で終わらせない。**
            # run 66 は上げるつもりで流して**成功**と記録され、上がって
            # いないことは11分後の小さな警告にしか出なかった。
            # 上げないつもり（submit=false）の回は今までどおり警告だけ。
            if [ "${SUBMIT:-}" = "true" ]; then
              echo "::error::TestFlight に上げる指定ですが、署名に要る Secrets が足りません（$missing ）。docs/GITHUB_ACTIONS.md の手順1〜3"
              exit 1
            fi
            echo "::warning::署名に要る Secrets が足りません（$missing ）。テストまでで終わります。docs/GITHUB_ACTIONS.md を参照"
          else
            echo "signing=true" >> "$GITHUB_OUTPUT"
          fi


      # 🔴 **iOS 26 SDK より古いと App Store Connect が受け取らない。**
      #
      # run 68 は署名もビルドも通ったのに、最後の1段だけで落ちた:
      #
      #     Validation failed (409) SDK version issue.
      #     This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps
      #     must be built with the iOS 26 SDK or later, included in Xcode 26
      #     or later, in order to be uploaded to App Store Connect.
      #
      # ランナーの既定は Xcode 16.4（iOS 18.5 SDK）だった。**13分使って
      # 最後に分かる**のは高いので、ここで**入っている Xcode の中から
      # いちばん新しいものを選び**、それでも足りなければ**30秒で止める**。
      #
      # 上げない回（`submit=false`）は止めない——絵を撮る用途は古い SDK でも
      # 成立するし、そちらまで赤くすると「本物の SwiftUI で通るか」が
      # 読めなくなる（秘密の点検と同じ考え）。
      # 🔴 **iOS 26 SDK より古いと App Store Connect が受け取らない。**
      #
      # run 68 は署名もビルドも通ったのに、最後の1段だけで落ちた:
      #
      #     Validation failed (409) SDK version issue.
      #     This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps
      #     must be built with the iOS 26 SDK or later, included in Xcode 26
      #     or later, in order to be uploaded to App Store Connect.
      #
      # ランナーの既定は Xcode 16.4（iOS 18.5 SDK）だった。**Xcode 26.3 は
      # 入っている**（run 69 で実測）ので、選び直せばよい。
      #
      # 🔴 **版は名前から読む。** 最初は各 `Xcode*.app` の `xcodebuild -version`
      # を呼んで調べたら、**その1つが SIGABRT で落ちて段ごと死んだ**
      # （run 69・exit 134）。GitHub の `run:` は `bash -e` なので、
      # **20個のうち1個でも落ちれば終わり**。外部コマンドを20回叩く必要は
      # 無い——名前が `Xcode_26.3.0.app` の形なので、そこから取って
      # `sort -V` で並べれば足りる（実測の一覧で確認済み）。
      - name: Xcodeを選択（iOS 26 SDK）
        env:
          SUBMIT: ${{ inputs.submit }}
        run: |
          # **`-e` を外す。** 調べものの段で、1つの失敗で死なせない
          set +e
          set -u

          echo "::group::入っている Xcode"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "（/Applications に Xcode*.app が無い）"
          echo "::endgroup::"

          # `Xcode_26.3.0.app` → `26.3.0`。数字とドットだけのものに限る
          # （`Xcode.app` や `Xcode_beta.app` は版が読めないので外す）
          ver="$(ls -d /Applications/Xcode_*.app 2>/dev/null \
                 | sed 's#.*/Xcode_##; s#\.app$##' \
                 | grep -E '^[0-9]+(\.[0-9]+)*$' \
                 | sort -V | tail -1)"
          if [ -n "$ver" ] && [ -d "/Applications/Xcode_$ver.app/Contents/Developer" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_$ver.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="/Applications/Xcode_$ver.app/Contents/Developer"
            echo "選んだ Xcode: $ver"
          else
            echo "::warning::版の読める Xcode が見つかりません。既定のまま進みます"
            ver="不明"
          fi

          echo "::group::使える iOS SDK"
          xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || echo "（iphoneos の SDK が読めない）"
          echo "::endgroup::"

          sdk="$(xcodebuild -showsdks 2>/dev/null | grep -io 'iphoneos[0-9][0-9.]*' | sed 's/iphoneos//' | sort -V | tail -1)"
          sdkmajor="${sdk%%.*}"
          case "$sdkmajor" in ''|*[!0-9]*) sdkmajor=0 ;; esac
          echo "いちばん新しい iOS SDK: ${sdk:-不明}"
          echo "### Xcode $ver / iOS SDK ${sdk:-不明}" >> "$GITHUB_STEP_SUMMARY"

          # **上げない回は止めない。** 絵を撮る用途は古い SDK でも成立するし、
          # そちらまで赤くすると「本物の SwiftUI で通るか」が読めなくなる
          # （秘密の点検と同じ考え）
          if [ "$sdkmajor" -lt 26 ]; then
            if [ "${SUBMIT:-}" = "true" ]; then
              echo "::error::iOS ${sdk:-?} SDK では App Store Connect が受け取りません（iOS 26 SDK 以上が要る）。上の「入っている Xcode」を見てください"
              exit 1
            fi
            echo "::warning::iOS ${sdk:-?} SDK です。上げるには iOS 26 SDK 以上が要ります（この回は上げないので続けます）"
          fi

      - name: Xcodeのバージョンを確認
        run: echo "XCODE_BUILD=$(xcodebuild -version | tr '\n' '-' | tr -d ' ')" >> "$GITHUB_ENV"

      # キャッシュ復元（数GB）より前に、数秒で終わる設定検査を実施。
      # 設定不備ならMacの重い準備を待たずに失敗させる。
      - name: 配信用アプリをビルド設定を検証
        run: python3 Tools/check-config.py

      # 🔴 **控えの鍵はここで1回だけ決める**（2026-10-17）。main の上げる回は、あとの「ビルド番号を決める」が
      # project.yml を書き換えるので、書く段で `hashFiles('project.yml')` を計算すると戻す段と鍵がずれる
      # 🔴 **控えは xcode-cache-warm.yml だけが書く・ここは読むだけ**（2026-11-11。前はこの回の「控えを温める」が書いていた）。
      # Archive（Release・実機向け）が使うのは控えの中の依存のソース（SourcePackages）。組んだものは Debug・シミュレータ向けで使わない
      - name: 控えを戻す
        id: cache
        uses: ./.github/actions/xcode-cache-restore

      - name: 配信用アプリをビルドツールをインストール
        run: |
          set -euo pipefail
          if ! command -v xcodegen >/dev/null 2>&1; then
            brew install xcodegen
          else
            echo "xcodegen はインストール済みのため再インストールしません"
          fi


      # Codemagic CLI は署名・Archive・アップロード時だけ必要。
      # UI確認だけの実行ではPythonパッケージの導入を省略する。
      - name: 配信用CLIを用意
        if: ${{ steps.secrets.outputs.signing == 'true' }}
        run: |
          set -euo pipefail
          if command -v app-store-connect >/dev/null 2>&1 && command -v xcode-project >/dev/null 2>&1 && command -v keychain >/dev/null 2>&1; then
            echo "配信用CLIは導入済み"
          elif command -v pipx >/dev/null 2>&1; then
            pipx install codemagic-cli-tools
          else
            python3 -m pip install --break-system-packages codemagic-cli-tools
          fi
          # pipxのインストール成功だけではPATH反映が保証されない。
          # 署名工程へ進む前に必要な3コマンドを検証し、欠けていればここで失敗させる。
          if [ -d "$HOME/.local/bin" ]; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
          fi
          for cli in app-store-connect xcode-project keychain; do
            if ! command -v "$cli" >/dev/null 2>&1; then
              echo "::error::配信用CLIが見つかりません: $cli"
              exit 1
            fi
          done

      - name: Xcodeプロジェクトを生成
        run: xcodegen generate

      # 🔴 **このワークフローは Archive と上げるだけ**（2026-11-11 owner「毎回のと ガチガチので」作り替え）。
      # テストは `ios-quick.yml`（毎回の・PR と枝の確かめ）と `ios-full.yml`（ガチガチの・手で押したときだけ）。
      # 上げない回（submit=false）は Release の組み立て（Archive）と署名までを確かめる
      - name: 署名証明書とプロファイルを準備
        if: ${{ steps.secrets.outputs.signing == 'true' }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # **鍵を自分で持つ。** 渡さないと CLI は毎回あたらしい配布証明書を
          # 作り、Apple の上限（配布証明書は2枚まで）にすぐ当たる
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "::error::CERTIFICATE_PRIVATE_KEY が未設定です（docs/GITHUB_ACTIONS.md の手順2）"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: ビルド番号を決める
        if: ${{ steps.secrets.outputs.signing == 'true' }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # **アプリの Apple ID は Bundle ID から引く**（人が画面から写さない）
          APP_APPLE_ID="$(bash Tools/app-apple-id.sh "$BUNDLE_ID" || true)"
          if [ -z "$APP_APPLE_ID" ]; then
            echo "::error::App Store Connect に $BUNDLE_ID のアプリが見つかりません（先にアプリの枠を作る）"
            exit 1
          fi
          echo "アプリの Apple ID: $APP_APPLE_ID"
          # **表に出る版を先に決める**（0.2.0 → 0.2.1 …・owner の依頼 2026-09-25）。
          # どこまで出したかは `testflight/<版>` のタグで覚える（下の「版の印を付ける」）。
          # ビルド番号はこの版で絞って数えるので、版が先
          MARKETING="$(bash Tools/next-marketing-version.sh)"
          echo "MARKETING=$MARKETING" >> "$GITHUB_ENV"
          # **ビルド番号は版ごとに 1 から数える**（2026-10-18 owner の判断:
          # TestFlight の表示を「1.1.14 (124)」ではなく「1.1.15 (1)」の形に）。
          # この版の TestFlight にある最大 + 1。この版のビルドがまだ無ければ 1。
          # - 絞る引数 `--pre-release-version` は codemagic-cli-tools 0.70.0 の
          #   `--help` と `latest_build_number_actions.py`（App Store Connect の
          #   preReleaseVersions を `filter[version]` で引く）で確認した（2026-10-18）
          # - 見つからないとき CLI は何も出さない（`Did not find latest build` を
          #   ログに出して None を返す）。失敗・空・数字でないものは 0 として扱う
          # - Apple の決まり: App Store Connect は「版とビルド番号の組み合わせ」が重ならない
          #   ことを求める。iOS は新しい版で前より小さいビルド番号を使ってよい（Mac は版を
          #   またいでも上がり続ける必要がある）。出典（2026-10-18 確認）:
          #   Apple「Setting the next build number for Xcode Cloud builds」
          #   https://developer.apple.com/documentation/xcode/setting-the-next-build-number-for-xcode-cloud-builds
          #   版は毎回上がるので 1 から数え直せる
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" \
                     --pre-release-version "$MARKETING" || true)
          LATEST="$(printf '%s' "$LATEST" | tr -d '[:space:]')"
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          bash Tools/set-build-number.sh $(( LATEST + 1 ))
          echo "表に出る版: ${MARKETING}（ビルド番号 $(( LATEST + 1 ))）"
          # ビルド番号と版は project.yml に書くので、プロジェクトを作り直す
          xcodegen generate
          xcode-project use-profiles

      - name: 配信用アプリをビルド
        id: archive
        if: ${{ steps.secrets.outputs.signing == 'true' }}
        run: |
          set -euo pipefail
          # **プラグインの関所はビルドにも立つ。** Amplify →
          # aws-sdk-swift → smithy-swift がビルドツールプラグインを持ち、
          # Xcode 15 以降は人が「Trust & Enable」を押す前提になっている
          # （run #4 のテストがこれで止まった）。CI には押す人がいない
          # **`--` の後ろに置けない。** `codemagic-cli-tools` の
          # `cli_app.py` は `parse_args()`（`parse_known_args` ではない）で、
          # `build-ipa` に位置引数は無い＝`unrecognized arguments` で終わる。
          # 素通しする口は `--archive-flags`（0.69.0 の
          # `_xcode_project/arguments.py` で確認）
          xcode-project build-ipa \
            --project JourneyPhoto.xcodeproj \
            --scheme JourneyPhoto \
            --archive-flags="-skipPackagePluginValidation -skipMacroValidation"

      # **アプリの中身ごとの大きさ**（2026-10-31 判断・札 #429 アプリ 1「測る仕組み」）。ipa は 57.2MB（2026-10-31）で、
      # 何が占めているか（字体・絵・依存の Frameworks・本体）を Archive の回ごとに残す。Archive が走った回だけ。
      # 数は段のログ・まとめ（Summary）・成果物 `build-logs` の `app-size.txt` に出す。**落ちても赤にしない**（上げる邪魔をしない）
      - name: アプリサイズを確認
        if: ${{ steps.archive.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          ipa="$(ls build/ios/ipa/*.ipa 2>/dev/null | head -1)"
          if [ -z "$ipa" ]; then echo "ipa が見つかりません"; exit 0; fi
          work="$(mktemp -d)"
          unzip -q "$ipa" -d "$work"
          app="$(ls -d "$work"/Payload/*.app 2>/dev/null | head -1)"
          [ -d "$app" ] || { echo ".app が見つかりません"; exit 0; }
          mkdir -p build/logs
          out=build/logs/app-size.txt
          {
            echo "ipa: $(du -k "$ipa" | cut -f1) KB（$(basename "$ipa")）"
            echo ".app: $(du -sk "$app" | cut -f1) KB"
            echo
            echo "== .app の直下（大きい順・KB）=="
            du -sk "$app"/* 2>/dev/null | sort -rn | sed "s|$app/||" | head -40
            echo
            echo "== Frameworks（大きい順・KB）=="
            du -sk "$app"/Frameworks/* 2>/dev/null | sort -rn | sed "s|$app/||" | head -40
            echo
            echo "== 1MB を超えるファイル（大きい順・KB）=="
            find "$app" -type f -size +1024k -exec du -k {} + 2>/dev/null | sort -rn | sed "s|$app/||" | head -40
            echo
            echo "== 種類ごと（拡張子・KB）=="
            find "$app" -type f -exec du -k {} + 2>/dev/null \
              | awk -F'\t' '{ n = split($2, p, "/"); f = p[n]; e = (index(f, ".") ? f : "(なし)"); sub(/^.*\./, "", e); s[e] += $1 } END { for (e in s) print s[e], e }' \
              | sort -rn | head -20
          } | tee "$out"
          {
            echo "### アプリの中身の大きさ"
            echo '```'
            head -60 "$out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          rm -rf "$work"

      - name: TestFlightへアップロード
        id: upload
        if: ${{ inputs.submit && steps.secrets.outputs.signing == 'true' && steps.archive.outcome == 'success' }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BETA_REVIEW: ${{ inputs.betaReview }}
        run: |
          set -euo pipefail
          # **審査には自動で出さない**（出す前にスクリーンショットと説明文が要る）
          #
          # 🔴 **`--testflight` は「上げる」ではなく「外部テスターの審査に出す」。**
          # run 70 は**上がって処理まで終わっていた**（`Processing state: VALID` /
          # `Internal build state: READY_FOR_BETA_TESTING`）のに、そのあとの
          # 外部審査への提出で落ちて、実行ごと赤くなった:
          #
          #     Complete test information is required to submit application
          #     ... build for external testing.
          #     App is missing required Beta App Information: Feedback Email.
          #     App is missing required Beta App Review Information:
          #     First Name, Last Name, Phone Number, Email.
          #
          # **内部テストには要らない。** 上げるだけなら `--path` で足りる。
          # 外部に配るときだけ `betaReview` を true にする（その前に
          # App Store Connect の「テスト情報」を埋めること）。
          if [ "${BETA_REVIEW:-}" = "true" ]; then
            app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight
          else
            app-store-connect publish --path "build/ios/ipa/*.ipa"
            echo "### TestFlight に上げました（内部テストはすぐ配れます）" >> "$GITHUB_STEP_SUMMARY"
            echo "外部テスターにも配るなら、App Store Connect の「テスト情報」を埋めてから \`betaReview: true\` で流し直してください" >> "$GITHUB_STEP_SUMMARY"
          fi

      # **上げるのに成功した回だけ印を付ける。** 次の回の版はこの続きになる
      # （`Tools/next-marketing-version.sh`）。失敗した回は印が無いので、
      # 同じ版がもう一度使われる。印を押せなくても**赤にしない**——
      # TestFlight には既に上がっている（次の回が同じ版を使うだけで、
      # ビルド番号は上がるので受け付けられる）
      - name: リリースバージョンを記録
        if: ${{ inputs.submit && steps.upload.outcome == 'success' && steps.archive.outcome == 'success' }}
        env:
          MARKETING: ${{ env.MARKETING }}
        run: |
          set -uo pipefail
          if [ -z "${MARKETING:-}" ]; then
            echo "::warning::版番号が設定されていないため、タグ作成をスキップします"
            exit 0
          fi
          # **押し損ねたらやり直す**（2026-10-07）。run 348 は GitHub が一時的に書き込みを
          # 落としていた間に当たり、1.0.69 を上げたのに印が付かなかった（後から
          # `version-tag.yml` で付け直した）。間を空けて最大4回
          git tag "testflight/$MARKETING"
          pushed=false
          for wait in 0 5 15 45; do
            sleep "$wait"
            if git push origin "testflight/$MARKETING"; then pushed=true; break; fi
          done
          if $pushed; then
            echo "### 表に出る版: $MARKETING" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::版の印 testflight/$MARKETING を押せませんでした。Actions の「版の印を付け直す」（version-tag.yml）で ${MARKETING} と $(git rev-parse --short HEAD) を渡して付けてください（付けないと次の回も同じ版になります）"
          fi


      - name: 失敗時の診断ログを収集
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          # **`~` は upload-artifact が展開しない**（常に0件になり、
          # `if-no-files-found: ignore` が黙らせる）。シェルで集めてから渡す
          # xcresultは添付画像・録画を含むため公開Artifactへコピーしない
          # **xcodebuild を直に叩くようにしたので、伏せ先はもう無い。**
          # 拾うのは自分で書いた全文ログと、`-resultBundlePath` の結果
          cp /tmp/xcodebuild-full.log build/logs/ 2>/dev/null || true
          # Unit/Test.xcresultも公開Artifactに含めない
          ls -la build/logs || true

      - name: 診断ログをアップロード
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-logs
          # テストの結果とビルドのログ。落ちた理由はここに残る
          # **`*.xml` はもう出ない。** `xcode-project run-tests` をやめた
          # 時点で JUnit の書き出しも無くなったので、ここだけ残していると
          # 「0件で何も上がらない」のを `if-no-files-found: ignore` が
          # 黙らせる（run #9 が実際そうだった）
          path: |
            build/ios/ipa/*.ipa
            build/logs/app-size.txt
          retention-days: 3
          if-no-files-found: ignore
