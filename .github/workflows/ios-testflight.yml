# TestFlight に上げる（GitHub Actions・macOS ランナー）。
#
# **公開リポジトリでだけ回す想定。** macOS ランナーは private だと
# **分数が10倍**で課金され、枠は owner のアカウント共通
# ——`photo-gallery` のデプロイ（毎回18分）が何回分も消える。
# CLAUDE.md が「枠切れ＝何も出せなくなる」と書いている状況そのもの
# （2026-08 に実際に20日間止まっている）。public なら標準ランナーは無料。
#
# **Mac は要らない。** 証明書もプロファイルも、App Store Connect の API キーから
# `codemagic-cli-tools`（Codemagic が公開している CLI・pip で入る）が作る。
# Codemagic の設定（`codemagic.yaml`）も残してあるので、どちらでも回せる。
name: TestFlight

on:
  workflow_dispatch:
    inputs:
      submit:
        description: "TestFlight に上げる（false ならビルドだけ）"
        type: boolean
        default: true
      betaReview:
        description: "外部テスターの審査にも出す（App Store Connect の「テスト情報」が埋まっていること）"
        type: boolean
        default: false
      storeShots:
        description: "App Store 用の原寸の絵（PNG）を `store-screenshots` の枝にも置く"
        type: boolean
        default: false
      tests:
        description: "テストも流す（main は PR の検証で通っているので要らない。main 以外の枝を確かめるときだけ）"
        type: boolean
        default: false
      # 2026-10-17 判断: 枝の確認（submit=false）の UI テストを、変えた画面だけに絞れるようにする。
      # run 462 の実測で1回 約69分のうち UI テストが33分（画面の絵19分・メダル11分）だった。
      # **絞った回は「全部のテストが通った」の印を付けない**ので、「PR の検証」は Mac の
      # テストを飛ばさず全部回す（main に入る前に必ず一度は全部が回る）。
      # 上げる回（submit=true）と storeShots の回では絞らない（ここに何を書いても無視）。
      # 上げる回でテストを流すかどうかは、今までどおり `tests` で決まる
      screens:
        description: "UI テストを絞る（撮る画面の名前かテスト名の一部・, 区切り。空＝全部。none＝起動の見張りだけ）。submit=true では絞らない（テストを流すかは tests で決まる）"
        type: string
        default: ""
      # 2026-10-31 判断（#429）: 全部の回（submit=false・screens 空）は、UI テストを別々の Mac 3台に分けて
      # 同時に流す（下の「テストの品を組む」から「まとめ」まで）。その前に、枝で変えた画面の UI テストを
      # 単体テストと同時に別の Mac で先に流し、落ちたら分けた段まで進めない。何を先に流すかは、空なら
      # 枝の差分から `Tools/pick-ui-tests.py --plan` が選ぶ。書けば `screens` と同じ書き方でそれを先に流す
      first:
        description: "全部の回で先に流す UI テスト（screens と同じ書き方。空＝枝で変えた画面から選ぶ）。落ちたら残りの UI テストは流さない"
        type: string
        default: ""

# 🔴 **TestFlight に上げる回は同時に1本だけ**（2026-10-04）。2本が同時に走ると、
# どちらも `Tools/next-marketing-version.sh` で同じ版を決め、**同じ版が2つ上がる**
# （2026-10-03: run 326 と 327 がどちらも 1.0.63 になった。CLAUDE.md「同じ版のまま出さない」）。
# 2本目は1本目が版の印（`testflight/<版>`）を付け終わるまで待ち、次の版を決める。
# 止めはしない（`cancel-in-progress: false`）。上げない回（submit=false）は版を決めないので、
# 回ごとの組にして待たせない。
# GitHub の決まりで、待てるのは1本だけ——3本目を流すと、待っていた2本目は取り消される
concurrency:
  group: testflight-${{ inputs.submit && 'upload' || github.run_id }}
  cancel-in-progress: false

# **渡していない権限は漏らせない**（photo-gallery の IAM-3 と同じ方針）。
# checkout に要るのは読み取りだけ。
permissions:
  contents: read

env:
  BUNDLE_ID: com.journeyphoto.JourneyPhoto

jobs:
  build:
    # **絵を置く枝（`screenshots`）へ押すのに書き込みが要る。**
    # 既定は上の `permissions` のとおり読み取りだけ。ここだけ開ける
    permissions:
      contents: write
    # **`macos-latest` に固定しない。** ランナーの既定 Xcode が上がると
    # 挙動が変わるので、上げるときは意図して上げる
    runs-on: macos-15
    # **初回は控えが無く、依存を丸ごと組む。** Amplify →
    # aws-sdk-swift → smithy-swift はテストの段だけで50分を超えた
    # （run #8）。60分で切ると `actions/cache` の後片付けまで
    # 巻き添えで止まり、**次の回もまた冷たい状態から始まる**。
    # 一度でも最後まで通せば、以後は控えから戻って短くなる
    # 2026-10-22: 画面の試験が 104 分を超える日があり、120 分では打ち切られる（ios-pr.yml と同じ理由）
    # 2026-10-31（#429）: 上げる回で tests=true にすると、ここで UI テストを1台で全部流す（約 130 分）。
    # 続く Archive・上げるまで入れると 160 分に当たる（run 788 は Archive の途中で cancelled）。
    # この組だけ上限を延ばす（上げる回の流れは変えない・止めもしない。理由は「どこまで流すかを決める」の注記）
    timeout-minutes: ${{ (inputs.submit && inputs.tests) && 240 || 160 }}

    steps:
      - uses: actions/checkout@v4

      # **どこまで流すかを最初に決める**（2026-10-17）。`screens` の打ち間違いで UI テストが
      # 0件になるのを、ビルドの前の数秒で止める（`Tools/pick-ui-tests.py` が候補を出して落ちる）。
      # full=true の回だけ、最後に「全部のテストが通った」の印の段を付ける
      - name: どこまで流すかを決める
        id: scope
        env:
          SCREENS: ${{ inputs.screens }}
          SUBMIT: ${{ inputs.submit }}
          STORE_SHOTS: ${{ inputs.storeShots }}
          TESTS: ${{ inputs.tests }}
        run: |
          set -euo pipefail
          # 🔴 **UI テストを別々の Mac に分けて流す回か**（2026-10-31・#429）。決め方は `pick-ui-tests.py --sharded`
          # の1か所だけ（下の「分けて流すかを決める」の job も同じものを呼ぶ。式を2つ書くとずれる）。
          # 上げない回（submit=false）で全部を流すとき（screens が空・all・全部 を含む・storeShots）。
          # 分けて流す回は、この job は Archive だけ。単体・UI は「テストの品を組む」から「まとめ」までの job が流す
          sharded="$(python3 Tools/pick-ui-tests.py --sharded "${SUBMIT:-}" "${STORE_SHOTS:-}" "${SCREENS:-}")"
          echo "sharded=$sharded" >> "$GITHUB_OUTPUT"
          # **上げる回で tests=true は1台で全部を流す**（分けると、上げるのを別の job で全部の組を待つ作りに変わる）。
          # 止めない: 上げる回の流れ（テスト → Archive → 上げる）は変えない約束で、main 以外の枝を確かめて上げる
          # 使い方が残っている。かわりに job の上限を 240 分に延ばし、時間がかかることを警告で出す
          if [ "${SUBMIT:-}" = "true" ] && [ "${TESTS:-}" = "true" ]; then
            echo "::warning::上げる回で tests=true なので、UI テストを1台で全部流します（約 130 分・上げるまで 3 時間近く）。枝を確かめるだけなら submit=false で流すと、別々の Mac に分けて約 70〜90 分です"
          fi
          if [ "${SUBMIT:-}" = "true" ] || [ "${STORE_SHOTS:-}" = "true" ]; then
            SCREENS=""
          fi
          python3 Tools/pick-ui-tests.py "${SCREENS:-}" > /tmp/ui-only-testing.txt
          if [ "$(cat /tmp/ui-only-testing.txt)" = "-only-testing:JourneyPhotoUITests" ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "### UI テスト: 全部" >> "$GITHUB_STEP_SUMMARY"
            if [ "$sharded" = "true" ]; then
              echo "単体テストと UI テストは、別々の Mac（「テストの品を組む」から「まとめ」まで）で流します。この job は Archive だけ" >> "$GITHUB_STEP_SUMMARY"
            fi
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            {
              echo "### UI テストを絞った回（screens: ${SCREENS}）"
              echo "この回は「Mac でテスト済み」と数えません。main に入る前に「PR の検証」が全部を回します。"
              echo
              sed 's/^/- /' /tmp/ui-only-testing.txt
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cat /tmp/ui-only-testing.txt

      # **依存の作り直しに毎回30分以上かかる。**
      # Amplify → aws-sdk-swift → smithy-swift は桁違いに大きく、
      # 素のランナーでは丸ごと組み直す。落としてきたソースと、組んだ
      # 中間生成物を控える（Xcode は古くなったものを自分で捨てる）。
      #
      # **鍵に Sources を含めない。** 含めると1文字直すたびに控えが
      # 外れて、いちばん高い依存のビルドからやり直しになる
      # 控えの鍵に混ぜる（Xcode が変わったら作り直す）
      # **いちばん先に見る。** 以前はテストの**あと**に置いていたので、
      # 秘密が1つ足りないだけの回でも**11分待たないと分からなかった**
      # （run 66 がそれ——TestFlight に上げるつもりで流して、11分後に
      # 「署名から先は飛ばしました」だけが残った）。何が足りないかは
      # **30秒で**分かるべきで、テストの結果とは何の関係も無い。
      #
      # **秘密がまだ無くてもテストまでは回す**（この節の元の意図）。
      # App Store Connect の API キーは人が画面から落としてくるもので、
      # 揃う前にも「本物の SwiftUI で通るか」を見たい。揃っていない回は
      # 署名から先を飛ばし、**緑で終わらせる**（赤にすると
      # 「コンパイルが通ったのか」が読み取れなくなる）
      - name: 秘密が揃っているかを見る
        id: secrets
        env:
          ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERT: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          SUBMIT: ${{ inputs.submit }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "${ISSUER:-}" ] || missing="$missing APP_STORE_CONNECT_ISSUER_ID"
          [ -n "${KEY_ID:-}" ] || missing="$missing APP_STORE_CONNECT_KEY_ID"
          [ -n "${KEY:-}" ]    || missing="$missing APP_STORE_CONNECT_PRIVATE_KEY"
          [ -n "${CERT:-}" ]   || missing="$missing CERTIFICATE_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "### 署名から先は飛ばしました" >> "$GITHUB_STEP_SUMMARY"
            echo "足りない Secrets:$missing" >> "$GITHUB_STEP_SUMMARY"
            # **二重引用符の中で逆引用符を使わない**（コマンドとして走る。
            # `setup-private-delivery.sh` で一度踏んだ）。単引用符で出す
            echo '（docs/GITHUB_ACTIONS.md の手順1〜3）' >> "$GITHUB_STEP_SUMMARY"
            # **「上げる」つもりで流した回は、緑で終わらせない。**
            # run 66 は上げるつもりで流して**成功**と記録され、上がって
            # いないことは11分後の小さな警告にしか出なかった。
            # 上げないつもり（submit=false）の回は今までどおり警告だけ。
            if [ "${SUBMIT:-}" = "true" ]; then
              echo "::error::TestFlight に上げる指定ですが、署名に要る Secrets が足りません（$missing ）。docs/GITHUB_ACTIONS.md の手順1〜3"
              exit 1
            fi
            echo "::warning::署名に要る Secrets が足りません（$missing ）。テストまでで終わります。docs/GITHUB_ACTIONS.md を参照"
          else
            echo "signing=true" >> "$GITHUB_OUTPUT"
          fi


      # 🔴 **iOS 26 SDK より古いと App Store Connect が受け取らない。**
      #
      # run 68 は署名もビルドも通ったのに、最後の1段だけで落ちた:
      #
      #     Validation failed (409) SDK version issue.
      #     This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps
      #     must be built with the iOS 26 SDK or later, included in Xcode 26
      #     or later, in order to be uploaded to App Store Connect.
      #
      # ランナーの既定は Xcode 16.4（iOS 18.5 SDK）だった。**13分使って
      # 最後に分かる**のは高いので、ここで**入っている Xcode の中から
      # いちばん新しいものを選び**、それでも足りなければ**30秒で止める**。
      #
      # 上げない回（`submit=false`）は止めない——絵を撮る用途は古い SDK でも
      # 成立するし、そちらまで赤くすると「本物の SwiftUI で通るか」が
      # 読めなくなる（秘密の点検と同じ考え）。
      # 🔴 **iOS 26 SDK より古いと App Store Connect が受け取らない。**
      #
      # run 68 は署名もビルドも通ったのに、最後の1段だけで落ちた:
      #
      #     Validation failed (409) SDK version issue.
      #     This app was built with the iOS 18.5 SDK. All iOS and iPadOS apps
      #     must be built with the iOS 26 SDK or later, included in Xcode 26
      #     or later, in order to be uploaded to App Store Connect.
      #
      # ランナーの既定は Xcode 16.4（iOS 18.5 SDK）だった。**Xcode 26.3 は
      # 入っている**（run 69 で実測）ので、選び直せばよい。
      #
      # 🔴 **版は名前から読む。** 最初は各 `Xcode*.app` の `xcodebuild -version`
      # を呼んで調べたら、**その1つが SIGABRT で落ちて段ごと死んだ**
      # （run 69・exit 134）。GitHub の `run:` は `bash -e` なので、
      # **20個のうち1個でも落ちれば終わり**。外部コマンドを20回叩く必要は
      # 無い——名前が `Xcode_26.3.0.app` の形なので、そこから取って
      # `sort -V` で並べれば足りる（実測の一覧で確認済み）。
      - name: Xcode を選ぶ（iOS 26 SDK が要る）
        env:
          SUBMIT: ${{ inputs.submit }}
        run: |
          # **`-e` を外す。** 調べものの段で、1つの失敗で死なせない
          set +e
          set -u

          echo "::group::入っている Xcode"
          ls -d /Applications/Xcode*.app 2>/dev/null || echo "（/Applications に Xcode*.app が無い）"
          echo "::endgroup::"

          # `Xcode_26.3.0.app` → `26.3.0`。数字とドットだけのものに限る
          # （`Xcode.app` や `Xcode_beta.app` は版が読めないので外す）
          ver="$(ls -d /Applications/Xcode_*.app 2>/dev/null \
                 | sed 's#.*/Xcode_##; s#\.app$##' \
                 | grep -E '^[0-9]+(\.[0-9]+)*$' \
                 | sort -V | tail -1)"
          if [ -n "$ver" ] && [ -d "/Applications/Xcode_$ver.app/Contents/Developer" ]; then
            echo "DEVELOPER_DIR=/Applications/Xcode_$ver.app/Contents/Developer" >> "$GITHUB_ENV"
            export DEVELOPER_DIR="/Applications/Xcode_$ver.app/Contents/Developer"
            echo "選んだ Xcode: $ver"
          else
            echo "::warning::版の読める Xcode が見つかりません。既定のまま進みます"
            ver="不明"
          fi

          echo "::group::使える iOS SDK"
          xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || echo "（iphoneos の SDK が読めない）"
          echo "::endgroup::"

          sdk="$(xcodebuild -showsdks 2>/dev/null | grep -io 'iphoneos[0-9][0-9.]*' | sed 's/iphoneos//' | sort -V | tail -1)"
          sdkmajor="${sdk%%.*}"
          case "$sdkmajor" in ''|*[!0-9]*) sdkmajor=0 ;; esac
          echo "いちばん新しい iOS SDK: ${sdk:-不明}"
          echo "### Xcode $ver / iOS SDK ${sdk:-不明}" >> "$GITHUB_STEP_SUMMARY"

          # **上げない回は止めない。** 絵を撮る用途は古い SDK でも成立するし、
          # そちらまで赤くすると「本物の SwiftUI で通るか」が読めなくなる
          # （秘密の点検と同じ考え）
          if [ "$sdkmajor" -lt 26 ]; then
            if [ "${SUBMIT:-}" = "true" ]; then
              echo "::error::iOS ${sdk:-?} SDK では App Store Connect が受け取りません（iOS 26 SDK 以上が要る）。上の「入っている Xcode」を見てください"
              exit 1
            fi
            echo "::warning::iOS ${sdk:-?} SDK です。上げるには iOS 26 SDK 以上が要ります（この回は上げないので続けます）"
          fi

      - name: Xcode の版を読む
        run: echo "XCODE_BUILD=$(xcodebuild -version | tr '\n' '-' | tr -d ' ')" >> "$GITHUB_ENV"

      # 🔴 **控えの鍵はここで1回だけ決める**（2026-10-17）。main の上げる回は、あとの「ビルド番号を決める」が
      # project.yml を書き換えるので、書く段で `hashFiles('project.yml')` を計算すると戻す段と鍵がずれる
      - name: 控えの鍵を決める
        run: echo "CACHE_KEY=xcode-deps-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('project.yml', 'Package.swift') }}" >> "$GITHUB_ENV"

      # 🔴 **控えは main の回だけが書く・枝は読むだけ**（2026-10-17 判断）。
      # 控えは1つ約7GB（run 461 の実測 7111MB）で、GitHub の置き場は10GBまで——**2つ目を書くと
      # 前のが追い出される**。しかも控えは枝ごとに区切られ、別の枝からは main の分しか読めない。
      # 前は枝の回がそれぞれ書いては互いを追い出し、直近の枝の回の半分以上（run 454〜465 の
      # 12回中9回）と PR の検証の Mac（見た3回とも）が「控え無し」で始まって、ビルドが約10分
      # 余計にかかっていた（run 462: 控え無しでテストの段 55分 / run 461: 控え有りで 41分）。
      # main の回が下の「控えを温める」でシミュレータ向けまで組んで書けば、どの枝・どの PR も読める
      - name: 前回の作りかけを控えから戻す
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Intermediates.noindex/ArchiveIntermediates
            ~/Library/Caches/org.swift.swiftpm
          # **Xcode の版を鍵に入れる。** 入れないと、ランナーの像が
          # 上がって Xcode が変わった回に**古い中間生成物が混ざる**。
          # しかも鍵は当たり続けるので控えは作り直されず、以後ずっと
          # 同じ壊れた控えから始まる（原因のいちばん見えにくい壊れ方）
          #
          # **鍵の末尾に回の番号を付ける**（2026-10-17）。main の回は毎回新しい鍵で書き、
          # 読む側は頭が合ういちばん新しいものを拾う。番号が無いと、鍵が当たり続けて
          # 控えが古いまま（ソースとの差が広がって差分のビルドが年々長くなる）
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
            xcode-deps-${{ runner.os }}-${{ env.XCODE_BUILD }}-

      - name: 設定の検査
        run: python3 Tools/check-config.py

      - name: 道具を入れる
        run: |
          set -euo pipefail
          brew install xcodegen
          # 署名・ビルド・提出をまとめて行う CLI（Codemagic が公開しているもの）。
          # **pipx が無い回に備える**——ランナーの構成は黙って変わる
          if command -v pipx >/dev/null 2>&1; then
            pipx install codemagic-cli-tools
          else
            python3 -m pip install --break-system-packages codemagic-cli-tools
          fi

      - name: Xcode プロジェクトを作る
        run: xcodegen generate

      # **既定ではテストを流さない**（2026-10-09 owner「テストフライトでの2重テストはしなくていい」）。
      # main に入るのは「PR の検証」の Mac のテストを通ったものだけなので、上げる回で同じテストを
      # もう一度流すと、Mac を30分ほど二重に使っていた。main 以外の枝を確かめるときは `tests: true`。
      # 画面の絵（下の `screenshots` の段）はこのテストの結果から作るので、テストを流した回だけ置く
      # 上げない回（submit=false・`/mac-check`）は絵とテストが目的なので、`tests` が無くても流す
      #
      # 🔴 **組む → 単体 → UI の3段**（2026-10-17・`Tools/xcode-test.sh`）。単体が落ちたら UI まで
      # 行かずに止まる（前は1回の `test` で、単体が落ちても UI の33分を待ってから赤になった）。
      # 🔴 **段の名前を「テスト」で始めない。** 「PR の検証」の「同じコミットが Mac でテスト済みか」は、
      # 前は「テスト」で始まる最初の段の成否を見ていた。名前を変えれば古い数え方は何も数えず
      # （＝飛ばさない側に倒れ）、新しい数え方は下の「全部のテストが通った」の印だけを数える
      - name: 組む（本物の SwiftUI で型検査される最初の機会）
        # 分けて流す回は、下の「テストの品を組む」の job が組む（この job は Archive だけ）
        if: ${{ (inputs.tests || inputs.storeShots || !inputs.submit) && steps.scope.outputs.sharded != 'true' }}
        run: |
          set -euo pipefail
          # 3段で同じシミュレータを使う
          echo "DEVICE=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_ENV"
          # **`-sdk iphonesimulator` は渡さない。** `-destination` と
          # 併用すると SDK 側の arch 一覧（arm64 と x86_64）が勝ち、
          # 行き先に `arch=arm64` を書いても x86_64 で組み立てにいく
          # （run #7 がそれ。run #6 と同じ `Smithy` のエラーが出続けた）。
          #
          # **アーキテクチャを1つに絞る。** macos-15 のランナーは
          # Apple Silicon で、シミュレータの行き先は arm64 と x86_64 の
          # **両方に一致する**（run #4 のログが "Using the first of
          # multiple matching destinations" と言っている）。絞らないと
          # xcodebuild は x86_64 でも組み立てようとし、arm64 でしか
          # 作られていない依存（Amplify → aws-sdk-swift → smithy-swift）で
          #   could not find module 'Smithy' for target 'x86_64-apple-ios-simulator'
          # と落ちる（run #6）。
          #
          # **`xcode-project run-tests` を使わない。** 出力を
          # `/tmp/xcodebuild_logs` に伏せるので、コンパイルが通らない回に
          # 「0件で失敗」としか残らない。run #1〜#3 をこれで空振りさせた
          # （伏せ先から拾い直す小細工も2回外した）。**xcodebuild を直に
          # 叩いて、出力をそのままログに出す**のが結局いちばん短い。
          # （この3つは `Tools/xcode-test.sh` の中に書いてある）
          DEVICE="$(python3 Tools/pick-simulator.py)" bash Tools/xcode-test.sh build

      - name: 単体テスト
        id: unit
        if: ${{ (inputs.tests || inputs.storeShots || !inputs.submit) && steps.scope.outputs.sharded != 'true' }}
        run: bash Tools/xcode-test.sh unit build/ios/test/Unit.xcresult

      # 画面の絵（`ScreenshotTests`）はここで撮る。結果の置き場は前と同じ `Test.xcresult`
      # （`Tools/export-screenshots.sh` が読む）。絞った回は `どこまで流すかを決める` の一覧だけ
      - name: UI テスト（画面の絵）
        id: ui
        if: ${{ (inputs.tests || inputs.storeShots || !inputs.submit) && steps.scope.outputs.sharded != 'true' }}
        run: bash Tools/xcode-test.sh ui build/ios/test/Test.xcresult /tmp/ui-only-testing.txt

      # 🔴 **「PR の検証」が「このコミットは Mac でテスト済み」と数える印**（2026-10-17）。
      # 単体と UI を**絞らずに全部**流して通った回だけ success になる。絞った回（screens）は
      # skipped になり数えられない＝PR の検証が Mac で全部を回す。名前を変えるときは
      # `ios-pr.yml` の `tested` の job も合わせる。
      # 分けて流す回（steps.scope.outputs.sharded）は単体・UI の段が skipped なのでここは付かず、「まとめ」の job の同じ名前の段が付く
      - name: 全部のテストが通った（PR の検証が数える印）
        if: ${{ (inputs.tests || inputs.storeShots || !inputs.submit) && steps.scope.outputs.full == 'true' && steps.unit.outcome == 'success' && steps.ui.outcome == 'success' }}
        run: echo "単体テストと UI テストを絞らずに全部流し、通りました"

      # **絞った回（screens）は署名・Archive をしない**（2026-10-17 判断）。Archive は毎回10分前後
      # （run 454〜462 で 8〜14分）。絞った回は「変えた画面を早く見る」ための回で、Release の
      # 組み立ては全部の回（screens 空）と、上げる回（submit=true・いつも全部）で見る。
      # `steps.scope.outputs.full` は上げる回では必ず true なので、上げる回には効かない
      - name: 署名の用意（証明書とプロファイルを API キーから作る）
        if: ${{ steps.secrets.outputs.signing == 'true' && steps.scope.outputs.full == 'true' }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # **鍵を自分で持つ。** 渡さないと CLI は毎回あたらしい配布証明書を
          # 作り、Apple の上限（配布証明書は2枚まで）にすぐ当たる
          if [ -z "${CERTIFICATE_PRIVATE_KEY:-}" ]; then
            echo "::error::CERTIFICATE_PRIVATE_KEY が未設定です（docs/GITHUB_ACTIONS.md の手順2）"
            exit 1
          fi
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --certificate-key @env:CERTIFICATE_PRIVATE_KEY \
            --create
          keychain add-certificates
          xcode-project use-profiles

      - name: ビルド番号を決める
        if: ${{ steps.secrets.outputs.signing == 'true' && steps.scope.outputs.full == 'true' }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          # **アプリの Apple ID は Bundle ID から引く**（人が画面から写さない）
          APP_APPLE_ID="$(bash Tools/app-apple-id.sh "$BUNDLE_ID" || true)"
          if [ -z "$APP_APPLE_ID" ]; then
            echo "::error::App Store Connect に $BUNDLE_ID のアプリが見つかりません（先にアプリの枠を作る）"
            exit 1
          fi
          echo "アプリの Apple ID: $APP_APPLE_ID"
          # **表に出る版を先に決める**（0.2.0 → 0.2.1 …・owner の依頼 2026-09-25）。
          # どこまで出したかは `testflight/<版>` のタグで覚える（下の「版の印を付ける」）。
          # ビルド番号はこの版で絞って数えるので、版が先
          MARKETING="$(bash Tools/next-marketing-version.sh)"
          echo "MARKETING=$MARKETING" >> "$GITHUB_ENV"
          # **ビルド番号は版ごとに 1 から数える**（2026-10-18 owner の判断:
          # TestFlight の表示を「1.1.14 (124)」ではなく「1.1.15 (1)」の形に）。
          # この版の TestFlight にある最大 + 1。この版のビルドがまだ無ければ 1。
          # - 絞る引数 `--pre-release-version` は codemagic-cli-tools 0.70.0 の
          #   `--help` と `latest_build_number_actions.py`（App Store Connect の
          #   preReleaseVersions を `filter[version]` で引く）で確認した（2026-10-18）
          # - 見つからないとき CLI は何も出さない（`Did not find latest build` を
          #   ログに出して None を返す）。失敗・空・数字でないものは 0 として扱う
          # - Apple の決まり: App Store Connect は「版とビルド番号の組み合わせ」が重ならない
          #   ことを求める。iOS は新しい版で前より小さいビルド番号を使ってよい（Mac は版を
          #   またいでも上がり続ける必要がある）。出典（2026-10-18 確認）:
          #   Apple「Setting the next build number for Xcode Cloud builds」
          #   https://developer.apple.com/documentation/xcode/setting-the-next-build-number-for-xcode-cloud-builds
          #   版は毎回上がるので 1 から数え直せる
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" \
                     --pre-release-version "$MARKETING" || true)
          LATEST="$(printf '%s' "$LATEST" | tr -d '[:space:]')"
          case "$LATEST" in ''|*[!0-9]*) LATEST=0 ;; esac
          bash Tools/set-build-number.sh $(( LATEST + 1 ))
          echo "表に出る版: ${MARKETING}（ビルド番号 $(( LATEST + 1 ))）"
          # ビルド番号と版は project.yml に書くので、プロジェクトを作り直す
          xcodegen generate
          xcode-project use-profiles

      - name: ビルド
        id: archive
        if: ${{ steps.secrets.outputs.signing == 'true' && steps.scope.outputs.full == 'true' }}
        run: |
          set -euo pipefail
          # **プラグインの関所はビルドにも立つ。** Amplify →
          # aws-sdk-swift → smithy-swift がビルドツールプラグインを持ち、
          # Xcode 15 以降は人が「Trust & Enable」を押す前提になっている
          # （run #4 のテストがこれで止まった）。CI には押す人がいない
          # **`--` の後ろに置けない。** `codemagic-cli-tools` の
          # `cli_app.py` は `parse_args()`（`parse_known_args` ではない）で、
          # `build-ipa` に位置引数は無い＝`unrecognized arguments` で終わる。
          # 素通しする口は `--archive-flags`（0.69.0 の
          # `_xcode_project/arguments.py` で確認）
          xcode-project build-ipa \
            --project JourneyPhoto.xcodeproj \
            --scheme JourneyPhoto \
            --archive-flags="-skipPackagePluginValidation -skipMacroValidation"

      - name: TestFlight に上げる
        if: ${{ inputs.submit && steps.secrets.outputs.signing == 'true' }}
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          BETA_REVIEW: ${{ inputs.betaReview }}
        run: |
          set -euo pipefail
          # **審査には自動で出さない**（出す前にスクリーンショットと説明文が要る）
          #
          # 🔴 **`--testflight` は「上げる」ではなく「外部テスターの審査に出す」。**
          # run 70 は**上がって処理まで終わっていた**（`Processing state: VALID` /
          # `Internal build state: READY_FOR_BETA_TESTING`）のに、そのあとの
          # 外部審査への提出で落ちて、実行ごと赤くなった:
          #
          #     Complete test information is required to submit application
          #     ... build for external testing.
          #     App is missing required Beta App Information: Feedback Email.
          #     App is missing required Beta App Review Information:
          #     First Name, Last Name, Phone Number, Email.
          #
          # **内部テストには要らない。** 上げるだけなら `--path` で足りる。
          # 外部に配るときだけ `betaReview` を true にする（その前に
          # App Store Connect の「テスト情報」を埋めること）。
          if [ "${BETA_REVIEW:-}" = "true" ]; then
            app-store-connect publish --path "build/ios/ipa/*.ipa" --testflight
          else
            app-store-connect publish --path "build/ios/ipa/*.ipa"
            echo "### TestFlight に上げました（内部テストはすぐ配れます）" >> "$GITHUB_STEP_SUMMARY"
            echo "外部テスターにも配るなら、App Store Connect の「テスト情報」を埋めてから \`betaReview: true\` で流し直してください" >> "$GITHUB_STEP_SUMMARY"
          fi

      # **上げるのに成功した回だけ印を付ける。** 次の回の版はこの続きになる
      # （`Tools/next-marketing-version.sh`）。失敗した回は印が無いので、
      # 同じ版がもう一度使われる。印を押せなくても**赤にしない**——
      # TestFlight には既に上がっている（次の回が同じ版を使うだけで、
      # ビルド番号は上がるので受け付けられる）
      - name: 版の印を付ける
        if: ${{ inputs.submit && steps.secrets.outputs.signing == 'true' }}
        run: |
          set -uo pipefail
          # **押し損ねたらやり直す**（2026-10-07）。run 348 は GitHub が一時的に書き込みを
          # 落としていた間に当たり、1.0.69 を上げたのに印が付かなかった（後から
          # `version-tag.yml` で付け直した）。間を空けて最大4回
          git tag "testflight/$MARKETING"
          pushed=false
          for wait in 0 5 15 45; do
            sleep "$wait"
            if git push origin "testflight/$MARKETING"; then pushed=true; break; fi
          done
          if $pushed; then
            echo "### 表に出る版: $MARKETING" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::版の印 testflight/$MARKETING を押せませんでした。Actions の「版の印を付け直す」（version-tag.yml）で ${MARKETING} と $(git rev-parse --short HEAD) を渡して付けてください（付けないと次の回も同じ版になります）"
          fi

      # **見た目を確かめられる場所はここしか無い。** 開発は Linux で進めて
      # いて、手元にあるのは `Shims/` の模型（修飾子は素通し＝配置も色も
      # 再現しない）。実際に描かれた絵は、このランナーのシミュレータに
      # しか存在しない。取り出し方と「なぜ artifact ではないのか」は
      # `Tools/export-screenshots.sh` の頭に書いた
      - name: 画面の絵を `screenshots` の枝に置く
        # 分けて流す回は「まとめ」の job が置く
        if: ${{ always() && (inputs.tests || inputs.storeShots || !inputs.submit) && steps.scope.outputs.sharded != 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_SHOTS: ${{ inputs.storeShots }}
          # 絞った回は撮らない画面があって当たり前なので、「撮れなかった画面」を数えない
          NARROWED: ${{ steps.scope.outputs.full != 'true' }}
        run: bash Tools/export-screenshots.sh build/ios/test/Test.xcresult

      - name: 落ちたときに読むものを集める
        if: ${{ always() }}
        run: |
          set -euo pipefail
          mkdir -p build/logs
          # **`~` は upload-artifact が展開しない**（常に0件になり、
          # `if-no-files-found: ignore` が黙らせる）。シェルで集めてから渡す
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.xcresult" -maxdepth 4             -exec cp -R {} build/logs/ \; 2>/dev/null || true
          # **xcodebuild を直に叩くようにしたので、伏せ先はもう無い。**
          # 拾うのは自分で書いた全文ログと、`-resultBundlePath` の結果
          cp /tmp/xcodebuild-full.log build/logs/ 2>/dev/null || true
          cp -R build/ios/test/Unit.xcresult build/logs/ 2>/dev/null || true
          cp -R build/ios/test/Test.xcresult build/logs/ 2>/dev/null || true
          ls -la build/logs || true

      - name: 落ちたときに読むもの
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          # 分けて流す回は「まとめ」の job が各台の分と合わせて `build-logs` にする（同じ名前は2つ作れない）
          name: ${{ steps.scope.outputs.sharded == 'true' && 'part-build' || 'build-logs' }}
          # テストの結果とビルドのログ。落ちた理由はここに残る
          # **`*.xml` はもう出ない。** `xcode-project run-tests` をやめた
          # 時点で JUnit の書き出しも無くなったので、ここだけ残していると
          # 「0件で何も上がらない」のを `if-no-files-found: ignore` が
          # 黙らせる（run #9 が実際そうだった）
          path: |
            build/ios/ipa/*.ipa
            build/logs/**
          retention-days: 7
          if-no-files-found: ignore

      # 🔴 **控えを書くのは main の回だけ**（2026-10-17 判断・上の「前回の作りかけを控えから戻す」）。
      # main の上げる回はテストを流さない（Release の Archive だけ）ので、そのままでは控えに
      # シミュレータ向けの組み立てが入らず、枝・PR の回の役に立たない。ここで組んでから書く。
      # main の控えから差分で組むので、2回目からは数分（run 461 は控え有りで、組むのは逆算で1〜2分。控え無しの run 462 は約12分）。
      # **上げる・印を付けるが済んだあと**に置き、落ちても赤にしない（上げる回の邪魔をしない）
      # Archive（「ビルド」）が通った回だけ温める・書く。落ちた回の作りかけは書かない。
      # **path の `!…/ArchiveIntermediates`**: Archive の中間物は控えに入れない（10GB を超えないように）。
      # 戻す・書く・PR の検証の3か所で path を揃える（違うと控えの版が合わず、当たらない）
      - name: 控えを温める（main の回だけ・シミュレータ向けに組む）
        id: warm
        if: ${{ steps.archive.outcome == 'success' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        timeout-minutes: 30
        # 🔴 **元のプロジェクトに戻してから組む**（2026-10-17 判断）。ここに来るまでに「ビルド番号を
        # 決める」が project.yml の版・ビルド番号を書き換え、`xcode-project use-profiles` が署名の設定を
        # .xcodeproj に入れている。そのまま組むと、控えに入るのは**枝や PR では作られない設定**の
        # 中間物になり、読む側で差分が大きくなる（設定が違えば組み直し）。project.yml を checkout の
        # 状態へ戻し、.xcodeproj（git に入っていない）を作り直してから組む
        run: |
          set -euo pipefail
          git checkout -- project.yml
          xcodegen generate
          XCODE_LOG=/tmp/xcodebuild-warm.log bash Tools/xcode-test.sh build

      - name: 控えを書く（main の回だけ）
        if: ${{ steps.warm.outcome == 'success' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Intermediates.noindex/ArchiveIntermediates
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}

  # ===========================================================================================
  # 🔴 **全部の回は、テストを別々の Mac に分けて同時に流す**（2026-10-31 判断・#429）
  #
  # run 778（41187923424）の実測: 全部の回 128 分 = 控え 2 分・組む 6 分・単体 8 分・UI 109 分（1台で1本ずつ）。
  #
  #   テストの品を組む（1台・組むのは1回だけ）
  #     ├─ 単体テスト（1台）           ┐ 同時に流す。どちらかが落ちたら、UI の分けた組は走らない
  #     └─ UI の先に流す分（1台）      ┘ （枝で変えた画面のテスト＋起動の見張り。単体より短く収める）
  #          └─ UI の分けた組 1〜3（3台・同時）
  #               └─ まとめ（絵を `screenshots` の枝に置く・`build-logs`・「全部のテストが通った」の印）
  #
  # - **組んだ品は成果物で渡す**（各台で組み直さない）。各台で組み直すと控えから戻す 2 分＋組む 6 分（run 778）
  # - **振り分けは1本ずつの実際の時間から**（`Tools/ui-test-times.json`・run 778 の全文ログから作った）。
  #   長いものから順に、いちばん軽い組に入れる。表に無い新しいテストは表の中央の値で見積もる。
  #   最後の組は「全部から、ほかの組と先に流した分を抜いた残り」なので、読み落としたテストも必ずどこかで流れる
  # - **先に流した分は分けた組から抜く**。テストの本数は1本も変わらない（足さない・減らさない）
  # - 単体テストは今までどおり1回。単体が落ちたら UI の分けた組には進まない
  #   （先に流す分は単体と同時に走る。単体より短く収めるので、通る回は延びない）
  # - Archive（Release の組み立て）は上の `build` の job が、ここと同時に流す
  # - 同時に動く Mac は多いときで4台（`build` の Archive・単体・先に流す分 → 分けた組3台）。
  #   公開リポジトリの Mac の同時実行は5台まで
  # ===========================================================================================
  # **分けて流すかを決める**（Linux で数秒）。job の `if:` には式しか書けず、`screens` の「all, x」・空白だけを
  # `pick-ui-tests.py` の `wants_all` と同じに読めない。`build` の job の「どこまで流すかを決める」と同じ
  # `--sharded` を呼んで、決め方を1か所にする（2026-10-31・見直しの指摘）
  shard-plan:
    name: 分けて流すかを決める
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sharded: ${{ steps.decide.outputs.sharded }}
    steps:
      - uses: actions/checkout@v4
      - name: 決める
        id: decide
        env:
          SCREENS: ${{ inputs.screens }}
          SUBMIT: ${{ inputs.submit }}
          STORE_SHOTS: ${{ inputs.storeShots }}
        run: |
          set -euo pipefail
          sharded="$(python3 Tools/pick-ui-tests.py --sharded "${SUBMIT:-}" "${STORE_SHOTS:-}" "${SCREENS:-}")"
          echo "sharded=$sharded" >> "$GITHUB_OUTPUT"
          echo "分けて流す: $sharded"

  test-build:
    name: テストの品を組む
    needs: shard-plan
    if: ${{ needs.shard-plan.outputs.sharded == 'true' }}
    runs-on: macos-15
    # 控えが外れて依存を丸ごと組むと50分を超える（run #8）
    timeout-minutes: 90
    outputs:
      xcode: ${{ steps.xcode.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # **何を先に流し、どう分けるかを最初に決める**（`Tools/pick-ui-tests.py --plan`）。
      # 枝の差分は GitHub の比べる口（main...この sha）から読む。読めなければ起動の見張りだけを先に流す。
      # 組の数（3）は下の `ui` の matrix と揃える（`Tools/check-config.py` が見る）
      - name: 先に流す UI テストと、分ける組を決める
        env:
          GH_TOKEN: ${{ github.token }}
          FIRST: ${{ inputs.first }}
        run: |
          set -euo pipefail
          if ! gh api -H "Accept: application/vnd.github.diff" \
                 "repos/${GITHUB_REPOSITORY}/compare/main...${GITHUB_SHA}" > /tmp/branch.diff; then
            echo "::warning::枝の差分が読めませんでした。先に流すのは起動の見張りだけにします"
            : > /tmp/branch.diff
          fi
          echo "枝の差分: $(grep -c '^diff --git' /tmp/branch.diff || true) ファイル"
          {
            echo "### UI テストの割り振り（3台に分けて同時に流す）"
            python3 Tools/pick-ui-tests.py --plan 3 build/ui-plan "${FIRST:-}" /tmp/branch.diff
          } >> "$GITHUB_STEP_SUMMARY"
          cat build/ui-plan/plan.md
          for f in build/ui-plan/*.txt; do echo "== $f"; cat "$f"; done

      - name: Xcode を選ぶ
        id: xcode
        run: bash Tools/select-xcode.sh

      - name: Xcode の版を読む
        run: echo "XCODE_BUILD=$(xcodebuild -version | tr '\n' '-' | tr -d ' ')" >> "$GITHUB_ENV"

      # 控えの鍵と path は `build` の job の「前回の作りかけを控えから戻す」と同じ（違うと当たらない）。読むだけ
      - name: 控えの鍵を決める
        run: echo "CACHE_KEY=xcode-deps-${{ runner.os }}-${{ env.XCODE_BUILD }}-${{ hashFiles('project.yml', 'Package.swift') }}" >> "$GITHUB_ENV"

      - name: 前回の作りかけを控えから戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
            ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
            !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Intermediates.noindex/ArchiveIntermediates
            ~/Library/Caches/org.swift.swiftpm
          key: ${{ env.CACHE_KEY }}-${{ github.run_id }}
          restore-keys: |
            ${{ env.CACHE_KEY }}
            xcode-deps-${{ runner.os }}-${{ env.XCODE_BUILD }}-

      - name: Xcode プロジェクトを作る
        run: |
          brew install xcodegen
          xcodegen generate

      - name: 組む（本物の SwiftUI で型検査される最初の機会）
        run: |
          set -euo pipefail
          mkdir -p build/logs
          XCODE_LOG=build/logs/xcodebuild-build.log bash Tools/xcode-test.sh build

      - name: 組んだ品を包む
        run: |
          set -euo pipefail
          products="$(find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 3 -type d -path '*/JourneyPhoto-*/Build/Products' | head -1)"
          python3 Tools/test-products.py pack "$products" build/test-products.tar
          ls -la build/test-products.tar

      # tar は自分で包んである（成果物の zip ではファイルの実行の権限が落ちるため）。縮める手間は軽くする
      - name: 組んだ品を渡す
        uses: actions/upload-artifact@v4
        with:
          name: test-products
          path: |
            build/test-products.tar
            build/ui-plan
          retention-days: 1
          compression-level: 1
          if-no-files-found: error

      - name: 組んだときのログを残す
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: part-test-build
          path: build/logs/*.log
          retention-days: 1
          if-no-files-found: ignore

  pre:
    name: ${{ matrix.part == 'unit' && '単体テスト' || 'UI テスト（先に流す分・変えた画面）' }}
    needs: test-build
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      # 片方が落ちても、もう片方は最後まで流す（どちらの失敗も1回で見える）
      fail-fast: false
      matrix:
        part: [unit, first]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-test-part
        with:
          part: ${{ matrix.part }}
          xcode: ${{ needs.test-build.outputs.xcode }}

  ui:
    name: UI テスト（分けた組 ${{ matrix.part }}/3）
    # 単体テストと先に流す分が両方とも通ったときだけ（どちらかが落ちたら skipped）
    needs: [test-build, pre]
    runs-on: macos-15
    # 1台あたりの見積もりは約 34 分。1本ごとの上限（Tools/xcode-test.sh）に当たる詰まりが続いても抜けられる長さ
    timeout-minutes: 90
    strategy:
      # 1つの組が落ちても、ほかの組は最後まで流す（前の1台の回も、1本落ちても残りを全部流していた）
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/mac-test-part
        with:
          part: ${{ matrix.part }}
          xcode: ${{ needs.test-build.outputs.xcode }}

  finish:
    name: まとめ（画面の絵・成果物・印）
    needs: [build, test-build, pre, ui]
    if: ${{ always() && needs.test-build.result != 'skipped' }}
    # 絵を置く枝（`screenshots`）へ押すのに書き込みが要る
    permissions:
      contents: write
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode を選ぶ（結果を読む・まとめる）
        run: bash Tools/select-xcode.sh "${{ needs.test-build.outputs.xcode }}"

      - name: 各台の結果を受け取る
        uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: build/parts

      # 前の1台の回と同じ形の `build-logs` にそろえる: logs/xcodebuild-full.log（組む → 単体 → 先に流す分 →
      # 組 1〜3 の順につないだもの）・logs/Unit.xcresult・logs/Test.xcresult（UI の結果を1つにまとめたもの）
      - name: 結果をまとめる
        if: ${{ always() }}
        run: |
          set -uo pipefail
          mkdir -p build/logs
          ls build/parts || true
          : > build/logs/xcodebuild-full.log
          # 成果物の中の並びは、入っていたものによって変わる（共通の親から下になる）ので find で探す
          for part in test-build unit first 1 2 3; do
            for log in $(find "build/parts/part-$part" -name '*.log' -not -path '*.xcresult/*' 2>/dev/null | sort); do
              echo "===== $part: $(basename "$log") =====" >> build/logs/xcodebuild-full.log
              cat "$log" >> build/logs/xcodebuild-full.log
            done
          done
          unit="$(find build/parts/part-unit -maxdepth 4 -type d -name Unit.xcresult 2>/dev/null | head -1)"
          if [ -n "$unit" ]; then cp -R "$unit" build/logs/; fi
          results=""
          for part in first 1 2 3; do
            r="$(find "build/parts/part-$part" -maxdepth 4 -type d -name "Test-$part.xcresult" 2>/dev/null | head -1)"
            if [ -n "$r" ]; then results="$results $r"; fi
          done
          echo "UI の結果:$results"
          echo "$results" > /tmp/ui-results.txt
          # 1つにまとめる（前と同じ `Test.xcresult` で読めるように）。まとめられなければ、組ごとのまま入れる
          # shellcheck disable=SC2086
          if [ -n "$results" ] && xcrun xcresulttool merge $results --output-path build/logs/Test.xcresult; then
            echo "UI の結果を Test.xcresult にまとめました"
          else
            echo "::warning::UI の結果を1つにまとめられませんでした。組ごとの結果を build-logs に入れます"
            for r in $results; do cp -R "$r" build/logs/; done
          fi
          # 流れた本数（前の1台の回と同じ本数かを見る）
          python3 Tools/pick-ui-tests.py --count-log build/logs/xcodebuild-full.log | tee -a "$GITHUB_STEP_SUMMARY"
          true

      - name: 画面の絵を `screenshots` の枝に置く
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORE_SHOTS: ${{ inputs.storeShots }}
          NARROWED: "false"
        # 組ごとの結果から取り出す（まとめた Test.xcresult が作れなかった回でも置ける）
        # 置き場の名前に空白は無い（build/parts/part-<組>/…）ので、わざと分けて渡す
        run: |
          # shellcheck disable=SC2046
          bash Tools/export-screenshots.sh $(cat /tmp/ui-results.txt)

      # 🔴 **「PR の検証」が数える印**（`build` の job の同じ名前の段の注記）。単体・先に流す分・分けた組の
      # 全部が通った回だけ success。分けて流す回はいつも絞らない（`screens` 空・storeShots）
      - name: 全部のテストが通った（PR の検証が数える印）
        if: ${{ needs.test-build.result == 'success' && needs.pre.result == 'success' && needs.ui.result == 'success' }}
        run: echo "単体テストと UI テスト（先に流す分と分けた組 3つ）を絞らずに全部流し、通りました"

      # `build` の job の Archive（ipa）と集めたものも、前と同じ `build-logs` に入れる
      - name: Archive の分を合わせる
        if: ${{ always() }}
        run: |
          set -uo pipefail
          if [ -d build/parts/part-build ]; then
            mkdir -p build/ios/ipa build/logs/build-job
            find build/parts/part-build -name '*.ipa' -exec cp {} build/ios/ipa/ \;
            # ipa のほか（`build` の job が集めたもの）は build-job/ の下へ
            (cd build/parts/part-build && find . -type f ! -name '*.ipa' | sed 's#^\./##') | while IFS= read -r f; do
              mkdir -p "build/logs/build-job/$(dirname "$f")"
              cp "build/parts/part-build/$f" "build/logs/build-job/$f"
            done
          fi
          ls -la build/logs build/ios/ipa 2>/dev/null || true

      - name: 落ちたときに読むもの
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/ios/ipa/*.ipa
            build/logs/**
          retention-days: 7
          if-no-files-found: ignore
