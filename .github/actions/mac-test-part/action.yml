# 組んだテストの品で、テストの1組を流す（2026-10-31・#429）。`ios-testflight.yml` の全部の回で、
# 「分けた組 1〜N」の各 Mac が使う（`ios-perf.yml` は first だけ）。
# 2026-11-12 から、組の台は `ui-plan/part-<組>.before` に書かれたもの（unit＝単体テスト・first＝先に流す分）を
# その組の UI テストの前に同じ台で流す。どれかが落ちても残りは最後まで流し、最後に落とす（1回で全部の失敗が見える）
#
# 組むのは「テストの品を組む」の1台だけで、ここはその品（成果物 `test-products`）をほどいて
# `test-without-building` で流す。run 778 の実測では、各台で組み直すと控えから戻す 2 分＋組む 6 分かかる。
# 流し方（時間の上限・名指しした回だけ流すテストを飛ばす）は `Tools/xcode-test.sh` のまま
#
# 結果（xcresult）と全文ログは、落ちても成果物 `part-<組>` に残す。「まとめ」の job が集めて
# 画面の絵を `screenshots` の枝に置き、`build-logs` にまとめる
name: テストの1組を流す
description: 組んだテストの品で、単体テスト・UI テストの1組を流す
inputs:
  part:
    description: "unit（単体テスト）・first（UI の先に流す分）・1〜9（分けた組。part-<組>.before の分も前に流す）"
    required: true
  xcode:
    description: 組んだ台の Xcode の版（同じ版を選ぶ）
    required: false
    default: ""
runs:
  using: composite
  steps:
    - name: Xcode を選ぶ（組んだ台と同じ版）
      shell: bash
      run: bash Tools/select-xcode.sh "${{ inputs.xcode }}"

    - name: 組んだ品を受け取る
      uses: actions/download-artifact@v4
      with:
        name: test-products
        path: build/products-in

    - name: 組んだ品をほどく
      shell: bash
      run: |
        set -euo pipefail
        xctestrun="$(python3 Tools/test-products.py unpack build/products-in/test-products.tar build/products)"
        echo "XCTESTRUN=$xctestrun" >> "$GITHUB_ENV"
        echo "DEVICE=$(python3 Tools/pick-simulator.py)" >> "$GITHUB_ENV"

    # **UI の組だけ、流す前にシミュレーターを温める**（2026-10-31・#429 の試し。理由と数は `Tools/warm-simulator.sh`）
    - name: シミュレーターを温める（UI の組だけ）
      if: ${{ inputs.part != 'unit' }}
      shell: bash
      run: bash Tools/warm-simulator.sh build/products

    # 🔴 **段の名前を「テスト」で始めない**（`ios-pr.yml` の古い数え方に拾われないように・`ios-testflight.yml` の注記）
    - name: 流す
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: |
        set -euo pipefail
        mkdir -p build/ios/test build/logs
        plan=build/products-in/ui-plan
        one() {
          export XCODE_LOG="build/logs/xcodebuild-$1.log"
          case "$1" in
            unit)  bash Tools/xcode-test.sh unit build/ios/test/Unit.xcresult ;;
            first) bash Tools/xcode-test.sh ui build/ios/test/Test-first.xcresult "$plan/first.txt" ;;
            [0-9]) bash Tools/xcode-test.sh ui "build/ios/test/Test-$1.xcresult" "$plan/part-$1.txt" ;;
            *) echo "::error::知らない組: $1"; return 2 ;;
          esac
        }
        todo=""
        case "$PART" in
          [0-9]) if [ -f "$plan/part-$PART.before" ]; then todo="$(cat "$plan/part-$PART.before")"; fi ;;
        esac
        failed=""
        for p in $todo "$PART"; do
          echo "==== 流す: $p"
          started=$(date +%s)
          one "$p" || failed="$failed $p"
          echo "流した: $p（$(( $(date +%s) - started )) 秒）"
          echo "- $p: $(( $(date +%s) - started )) 秒" >> "$GITHUB_STEP_SUMMARY"
        done
        if [ -n "$failed" ]; then
          echo "::error::落ちた組:$failed"
          exit 1
        fi

    # 公開リポジトリではxcresult・添付画像・生ログをArtifactに保存しない。
    # テスト失敗の詳細はジョブのSummaryで確認する。
    - name: テスト結果をSummaryに表示
      if: ${{ always() }}
      shell: bash
      run: |
        for r in build/ios/test/*.xcresult; do
          [ -d "$r" ] || continue
          python3 Tools/xcresult-summary.py "$r" >> "$GITHUB_STEP_SUMMARY"
        done

    - name: 組ごとの実行状況を渡す
      if: ${{ always() }}
      shell: bash
      env:
        PART: ${{ inputs.part }}
      run: |
        mkdir -p build/public-results
        echo "組 $PART の結果はActionsのジョブSummaryを参照してください。" > "build/public-results/$PART.txt"

    - name: 公開可能な状態ファイルだけを渡す
      if: ${{ always() }}
      uses: actions/upload-artifact@v4
      with:
        name: part-${{ inputs.part }}
        path: build/public-results/*.txt
        retention-days: 1
        if-no-files-found: ignore
