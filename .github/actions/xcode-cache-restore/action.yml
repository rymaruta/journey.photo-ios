# Mac の控え（DerivedData）を戻して、ソースの時刻を中身から揃える（2026-11-11・毎回のを速くする (a)(b)）。
# 使うのは ios-quick.yml・mac-sharded-tests.yml（ガチガチの）・ios-testflight.yml・ios-perf.yml。書くのは xcode-cache-warm.yml だけ。
#
# (a) **控えは依存と組んだものだけ**（v3）。前の形（v1）は 7.2GB（zstd）で、戻すのに 3〜8 分かかっていた。中身は
#     SwiftPM の置き場の写し（`~/Library/Caches/org.swift.swiftpm` 3.3GB・`SourcePackages/repositories` 3.2GB）と、
#     除いたつもりで入っていた Archive の中間物（1.3GB）。これらを消しても依存を取りに行かずに組めた（測る回
#     run 42996168684: 取りに行った行 0・zstd で 500MB）。
#     🔴 **path に `!` で除く行を書かない。除くものは、書く回（xcode-cache-warm.yml）が書く前に消す。**
#     `!~/…` の行は効かなかった（`~` が広げられていないと見ている・理由は確かめていない）: v1 は除いたはずの .app（296MB）と
#     Archive の中間物（1.3GB）を持っていて、`/**` まで書いた v2 も SwiftPM の置き場の写しを持ったまま 3,976MB になった
#     （run 43009013358 が書き、43010473945 が戻すのに 5.5 分）。v3 は「消してから書く」
#     🔴 **残っている遅さ: 組む前の「依存の図を解く」（Resolve Package Graph）が 64〜250 秒**（取りに行く行は 0）。
#     SwiftPM の置き場の写し（repositories 3.2GB）があると 19 秒・そのあと組むのは 124 秒（run 43034233884）。
#     写しを控えに入れると戻すのが 3GB 増える。manifests（2MB）を入れても縮まなかった（run 43031668253: 250 秒）。
#     Package.resolved に固定（-disableAutomaticPackageResolution）しても縮まない（同 272 秒・取りに行った 30 行）
# (b) **ソースの時刻を中身から決める**（`Tools/source-mtime.py`）。控えを書いた回と中身が同じファイルは同じ時刻になり、
#     Xcode が組み直さない。控えを書く回（xcode-cache-warm.yml）も同じ道具を組む前に流す
#
# 🔴 **path の並びを変えたら、xcode-cache-warm.yml の「控えを書く」も同じにする**（並びが違うと控えの版が合わず、
# 当たらない・`Tools/check-config.py` が見る）。鍵には Xcode の版と project.yml（依存の版）の中身を入れる
name: Mac の控えを戻す
description: DerivedData の控え（v3・無ければ v1）を戻し、ソースの時刻を中身から揃える
outputs:
  hit:
    description: "v3（今の形の控え）・v1（前の形の控え）・none（無い: 依存を丸ごと組む）"
    value: ${{ steps.result.outputs.hit }}
  exact:
    description: "true: この Xcode と依存の版（鍵の頭が同じ）の v3 が当たった"
    value: ${{ steps.result.outputs.exact }}
  key:
    description: 控えを書くときの鍵の頭（xcode-cache-warm.yml が回の番号を足して書く）
    value: ${{ steps.key.outputs.key }}
runs:
  using: composite
  steps:
    - name: 控えの鍵
      id: key
      shell: bash
      run: |
        xb="$(xcodebuild -version | tr '\n' '-' | tr -d ' ')"
        echo "XCODE_BUILD=$xb" >> "$GITHUB_ENV"
        echo "xb=$xb" >> "$GITHUB_OUTPUT"
        echo "key=xcode-v3-${{ runner.os }}-${xb}-${{ hashFiles('project.yml') }}" >> "$GITHUB_OUTPUT"
        echo "v1=xcode-deps-${{ runner.os }}-${xb}-${{ hashFiles('project.yml', 'Package.swift') }}" >> "$GITHUB_OUTPUT"
        echo "started=$(date +%s)" >> "$GITHUB_OUTPUT"

    - name: 控えを戻す（v3・依存と組んだものだけ）
      id: v2
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
          ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
        key: ${{ steps.key.outputs.key }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.key.outputs.key }}
          xcode-v3-${{ runner.os }}-${{ steps.key.outputs.xb }}-

    # 🔴 **戻すのが途中で止まったら、もう 1 回だけ試す**（2026-11-11 run 43039583129: 494MB の 31% で落ちる速さが
    # 0.4〜1MB/s になり「Failed to restore: … timeout」→ 控え無しで丸ごと組んで 25 分の上限に当たった）
    - name: 控えを戻す（v3・もう 1 回）
      id: v3retry
      if: ${{ steps.v2.outputs.cache-matched-key == '' }}
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
          ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
        key: ${{ steps.key.outputs.key }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.key.outputs.key }}
          xcode-v3-${{ runner.os }}-${{ steps.key.outputs.xb }}-

    # v3 がまだ無いあいだ（main が初めて書くまで）だけ、前の形を読む（7.2GB・遅いが、依存を丸ごと組むよりは速い）
    - name: 控えを戻す（v1・前の形）
      id: v1
      if: ${{ steps.v2.outputs.cache-matched-key == '' && steps.v3retry.outputs.cache-matched-key == '' }}
      uses: actions/cache/restore@v6
      with:
        path: |
          ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/SourcePackages
          ~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build
          !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.dSYM
          !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.app
          !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.xctest
          !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Products/**/*.xcresult
          !~/Library/Developer/Xcode/DerivedData/JourneyPhoto-*/Build/Intermediates.noindex/ArchiveIntermediates
          ~/Library/Caches/org.swift.swiftpm
        key: ${{ steps.key.outputs.v1 }}-${{ github.run_id }}
        restore-keys: |
          ${{ steps.key.outputs.v1 }}
          xcode-deps-${{ runner.os }}-${{ steps.key.outputs.xb }}-

    - name: ソースの時刻を中身から揃える
      shell: bash
      run: python3 Tools/source-mtime.py

    - name: 控えの結果
      id: result
      shell: bash
      env:
        V2: ${{ steps.v2.outputs.cache-matched-key || steps.v3retry.outputs.cache-matched-key }}
        V1: ${{ steps.v1.outputs.cache-matched-key }}
        STARTED: ${{ steps.key.outputs.started }}
        KEY: ${{ steps.key.outputs.key }}
      run: |
        if [ -n "$V2" ]; then hit=v3; elif [ -n "$V1" ]; then hit=v1; else hit=none; fi
        # 同じ依存の版（鍵の頭が同じ）の v3 が当たったときだけ、依存を取りに行かない（Tools/xcode-test.sh）
        exact=false
        case "$V2" in "$KEY"-*|"$KEY") exact=true; echo "XCODE_SKIP_PACKAGE_UPDATES=1" >> "$GITHUB_ENV" ;; esac
        echo "exact=$exact" >> "$GITHUB_OUTPUT"
        echo "hit=$hit" >> "$GITHUB_OUTPUT"
        {
          echo "### Mac の控え"
          echo "- ${hit}（${V2:-${V1:-当たらなかった}}）・戻すのに $(( $(date +%s) - STARTED )) 秒"
          if [ "$hit" = "none" ]; then
            echo "- ⚠️ 控えが当たらなかった（Xcode が上がった・project.yml の依存が変わった）。依存を丸ごと組む（1 回の実測で組む 15.7 分・run 43013029429。遅い台では 30 分に近づく）。"
            echo "  main で xcode-cache-warm.yml が書き直す（/mac-check の「Xcode が上がったとき」）"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
