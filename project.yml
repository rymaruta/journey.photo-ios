# XcodeGen のプロジェクト定義。
#
# .xcodeproj はコミットしない（マージのたびに競合し、どの設定が効いているか
# 読めなくなるため）。Mac 側で次を実行して生成する:
#
#     brew install xcodegen
#     xcodegen generate
#     open JourneyPhoto.xcodeproj
#
# 設定の唯一の出どころはこのファイルと Config/*.xcconfig。

name: JourneyPhoto
options:
  bundleIdPrefix: com.journeyphoto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

configs:
  Debug: debug
  Release: release

packages:
  Amplify:
    url: https://github.com/aws-amplify/amplify-swift
    from: 2.27.0

targets:
  JourneyPhoto:
    type: application
    platform: iOS
    sources:
      - path: Sources/JourneyPhoto
    dependencies:
      - package: Amplify
        product: Amplify
      - package: Amplify
        product: AWSCognitoAuthPlugin
      # ID トークンを取り出す `AuthCognitoTokensProvider` がここに居る
      - package: Amplify
        product: AWSPluginsCore
    configFiles:
      Debug: Config/Staging.xcconfig
      Release: Config/Production.xcconfig
    info:
      path: Sources/JourneyPhoto/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        # **版番号は1か所にだけ書く。** ここに直の値を書くと、下の
        # MARKETING_VERSION / CURRENT_PROJECT_VERSION と食い違っても
        # 気づけない（Info.plist の値が勝つ）。TestFlight は同じビルド番号を
        # 受け付けないので、ここが古いと毎回はねられる
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # **起動画面は真っ白にしない。** 既定（空の辞書）だと白か黒の板が
        # 出るだけで、アイコンから本編への繋がりが切れる
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageRespectsSafeAreaInsets: true
        # **同梱の書体。** 名前は Resources/Fonts/ のファイル名（`JPFont` が
        # PostScript 名で引く）。見出しの明朝は第1水準まで削った版
        # （`Tools/make-display-font.py`）、等幅は原本。ライセンスは同じ場所の OFL-*.txt
        UIAppFonts:
          - ShipporiMinchoB1-Bold.ttf
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
        # 既定の言語は日本語。英語も持つ（画面の文字も権限の文も二言語）
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # 実行時に読む環境値。値は xcconfig 側で切り替える
        JPUserApiBaseURL: $(JP_USER_API_BASE_URL)
        JPApiBaseURL: $(JP_API_BASE_URL)
        JPSiteBaseURL: $(JP_SITE_BASE_URL)
        JPCognitoUserPoolId: $(JP_COGNITO_USER_POOL_ID)
        JPCognitoClientId: $(JP_COGNITO_CLIENT_ID)
        JPCognitoRegion: $(JP_COGNITO_REGION)
        JPEnvironmentName: $(JP_ENV_NAME)
        # 5.1.1 / 4.2 で審査官が読む利用目的。日本語と英語の両方を出す
        NSCameraUsageDescription: 写真を撮って投稿するためにカメラを使います。
        NSPhotoLibraryUsageDescription: 端末の写真を選んで投稿するために使います。
        NSPhotoLibraryAddUsageDescription: 撮った写真を端末に保存するために使います。
        # 実際に位置を要求するのは撮影地マップの現在地ボタン（寄せる・点と向きを描く・保存しない）。
        # 投稿の撮影地は写真の EXIF から読むので、ここで取った位置は使わない
        NSLocationWhenInUseUsageDescription: 撮影地マップで、現在地と向いている方向を表示し、地図をその周りへ寄せるために使います。位置は保存も送信もしません。
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(JP_BUNDLE_ID)
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "3"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        SWIFT_STRICT_CONCURRENCY: minimal
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      # **プッシュの環境は構成ごとに変える。**
      # 端末が受け取るトークンは、ビルドの `aps-environment` で
      # sandbox / production のどちらかに決まる。ここを1つに固定すると、
      # staging（`deploy-api.yml` が sandbox に送る）へ production の
      # トークンが登録され、APNs が `400 BadDeviceToken` を返し、
      # サーバーが**その宛先を無効と判じて消す**——「許可したのに
      # 二度と届かない」という、いちばん追いにくい壊れ方になる。
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Sources/JourneyPhoto/JourneyPhoto.Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Sources/JourneyPhoto/JourneyPhoto.Release.entitlements

  JourneyPhotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/JourneyPhotoTests
    dependencies:
      - target: JourneyPhoto
    settings:
      base:
        SWIFT_VERSION: "5.0"
        # **テストの束にも Info.plist が要る。** 無いと署名の段で
        #   Cannot code sign because the target does not have an Info.plist
        # と言われ、**1行もコンパイルされないまま**テストが止まる
        # （run #5 がこれ。アプリ側は `info:` で作っているが、
        #  テスト側には何も無かった）。中身を持たせる理由は無いので、
        # Xcode に自動生成させる
        GENERATE_INFOPLIST_FILE: YES
        # **リテラルで書く。** XcodeGen は既定で `$(JP_BUNDLE_ID).tests`
        # を置くが、この的には `configFiles` が無く `$(JP_BUNDLE_ID)` は
        # 空なので、識別子が `.tests` だけになって束を入れられない
        PRODUCT_BUNDLE_IDENTIFIER: com.journeyphoto.JourneyPhotoTests
        # 署名まわりは要らない（シミュレータでしか動かさない）
        CODE_SIGNING_ALLOWED: NO

  # **起動スモーク。** 単体テストでは捕まらない「起動直後に落ちる」類を見る
  # （Info.plist の欠け・`@EnvironmentObject` の配り忘れ・Amplify の初期化）。
  # Web 側が実ブラウザのスモークを必ず通しているのと同じ役目
  JourneyPhotoUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests/JourneyPhotoUITests
    dependencies:
      - target: JourneyPhoto
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.journeyphoto.JourneyPhotoUITests
        CODE_SIGNING_ALLOWED: NO
        TEST_TARGET_NAME: JourneyPhoto

schemes:
  JourneyPhoto:
    build:
      targets:
        JourneyPhoto: all
        JourneyPhotoTests: [test]
        JourneyPhotoUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - JourneyPhotoTests
        - JourneyPhotoUITests
    archive:
      config: Release
