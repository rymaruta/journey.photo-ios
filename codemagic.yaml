# Mac を持っていなくても、ここで**ビルドして TestFlight まで上げる**。
#
# 設定はブラウザだけで済む（`docs/NO_MAC.md`）:
#   1. App Store Connect で API キーを作る
#   2. Codemagic に GitHub と API キーを繋ぐ
#   3. このファイルが読まれて、ビルド → TestFlight
#
# **署名の証明書は Codemagic が作る。** Mac も Keychain も要らない
# （`ios_signing` に書いた Bundle ID で、API キー経由で発行される）。

workflows:
  ios-testflight:
    name: TestFlight へ上げる
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Codemagic の画面で登録したキーの名前。**ここを合わせること**
      app_store_connect: JourneyPhotoASC

    environment:
      xcode: latest
      vars:
        # App Store Connect のアプリの ID（数字）。画面の URL に出ている
        APP_APPLE_ID: 0000000000
        BUNDLE_ID: com.journeyphoto.JourneyPhoto
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.journeyphoto.JourneyPhoto

    scripts:
      - name: 検査（構文・参照・設定・突き合わせ）
        script: |
          # **上げる前に手元と同じ検査を通す。** ここで落ちれば、
          # 10分かけてビルドしてから気づくことがなくなる
          brew install node python@3.12 || true
          (cd Tools && npm install --silent)
          node Tools/check-swift-syntax.js Sources Tests
          node Tools/check-swift-refs.js Sources Tests
          python3 Tools/check-config.py

      - name: ビルド番号を決める
        script: |
          # **TestFlight にある最大の番号 + 1。** 手で上げ忘れて
          # はねられる事故が無くなる
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" || echo 0)
          bash Tools/set-build-number.sh $(( LATEST + 1 ))

      - name: Xcode プロジェクトを作る
        script: |
          brew install xcodegen
          xcodegen generate

      - name: ビルドとテスト
        script: |
          xcode-project use-profiles
          xcode-project build-ipa \
            --project JourneyPhoto.xcodeproj \
            --scheme JourneyPhoto

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        # **TestFlight まで。審査には自動で出さない**
        # （出す前にスクリーンショットと説明文を入れる必要がある）
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - journey.photo.official@gmail.com
        notify:
          success: true
          failure: true
