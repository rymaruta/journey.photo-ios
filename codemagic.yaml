# Mac を持っていなくても、ここで**ビルドして TestFlight まで上げる**。
#
# **こちらは動かしていない。** 2026-09-21 に GitHub Actions へ移したので、
# 実際に回して確かめているのは `.github/workflows/ios-testflight.yml` の方。
# ここには Actions 側で実測して分かった直し（プラグインの関所・arm64 への
# 絞り込み・出力を伏せない）を写してあるが、**Codemagic で通したことは
# 一度もない**。使うときは、まずこの段が緑になることから確かめること。
#
# 設定はブラウザだけで済む（`docs/NO_MAC.md`）:
#   1. App Store Connect で API キーを作る
#   2. Codemagic に GitHub と API キーを繋ぐ
#   3. このファイルが読まれて、ビルド → TestFlight
#
# **署名の証明書は Codemagic が作る。** Mac も Keychain も要らない
# （`ios_signing` に書いた Bundle ID で、API キー経由で発行される）。

workflows:
  ios-testflight:
    name: TestFlight へ上げる
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Codemagic の画面で登録したキーの名前。**ここを合わせること**
      app_store_connect: JourneyPhotoASC

    environment:
      xcode: latest
      vars:
        # **App Store Connect のアプリの ID（数字）は、CI が自分で引く**
        # （`Tools/app-apple-id.sh` が Bundle ID から探す）。
        # 引けないとき（API キーが未設定・アプリ未登録）だけ、ここに
        # 画面の URL に出ている数字を書く
        APP_APPLE_ID: ""
        BUNDLE_ID: com.journeyphoto.JourneyPhoto
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.journeyphoto.JourneyPhoto

    scripts:
      - name: 設定の検査
        script: |
          # **標準の python3 だけで動くものに絞る。** 構文と参照の検査は
          # node と tree-sitter が要り、ここで入れると落ちる面が増える
          # （それらは push 前に手元で通している）
          python3 Tools/check-config.py

      - name: ビルド番号を決める
        script: |
          # **アプリの Apple ID は Bundle ID から引く。** 人が画面から
          # 写してこない（写し忘れでビルドが始まらない時間を作らない）
          if [ -z "${APP_APPLE_ID:-}" ]; then
            APP_APPLE_ID="$(bash Tools/app-apple-id.sh "$BUNDLE_ID" || true)"
          fi
          if [ -z "${APP_APPLE_ID:-}" ]; then
            echo "App Store Connect に $BUNDLE_ID のアプリが見つかりませんでした。"
            echo "  - まだアプリを作っていない → App Store Connect で新規作成する"
            echo "  - 作ってある → codemagic.yaml の APP_APPLE_ID に"
            echo "    アプリを開いたときの URL の数字を書く（docs/NO_MAC.md の手順2）"
            exit 1
          fi
          echo "アプリの Apple ID: $APP_APPLE_ID"
          # あとの段（公開）からも見えるようにする
          echo "APP_APPLE_ID=$APP_APPLE_ID" >> "$CM_ENV"
          # **TestFlight にある最大の番号 + 1。** 手で上げ忘れて
          # はねられる事故が無くなる
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID" || echo 0)
          bash Tools/set-build-number.sh $(( LATEST + 1 ))

      - name: Xcode プロジェクトを作る
        script: |
          brew install xcodegen
          xcodegen generate

      - name: テスト（本物の SwiftUI で型検査される最初の機会）
        script: |
          # **ここが「実機の SDK で通るか」を見る本番。** 手元（Linux）の
          # ビルドは SwiftUI の模型に向けたものなので、ここで初めて本物に当たる。
          # 分数を節約したくなったら、この段を消してもよい（次の段が
          # アプリ本体は同じ SDK でビルドする）
          # 機種名は固定しない（その場にある いちばん新しい iPhone を選ぶ）
          DEVICE=$(python3 Tools/pick-simulator.py) || exit 1
          echo "テストに使うシミュレータ: $DEVICE"
          # **`run-tests` を使わない。** xcodebuild の出力を
          # `/tmp/xcodebuild_logs` に伏せるので、コンパイルが通らない回の
          # ログに「0件で失敗」としか残らない（GitHub Actions 側で
          # run #1〜#3 をこれで空振りさせた）。
          #
          # `-sdk` は渡さない・`arch=arm64` に絞る・プラグインの関所を
          # 抜ける——どれも Actions 側で実測して分かったもの
          set -o pipefail
          xcodebuild \
            -project JourneyPhoto.xcodeproj \
            -scheme JourneyPhoto \
            -destination "platform=iOS Simulator,name=$DEVICE,arch=arm64" \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            -resultBundlePath build/ios/test/Test.xcresult \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            test 2>&1 | tee /tmp/xcodebuild-full.log | tail -n 400

      - name: ビルド
        script: |
          xcode-project use-profiles
          # プラグインの関所はビルドにも立つ。素通しする口は
          # `--archive-flags`（`--` の後ろには置けない）
          xcode-project build-ipa \
            --project JourneyPhoto.xcodeproj \
            --scheme JourneyPhoto \
            --archive-flags="-skipPackagePluginValidation -skipMacroValidation"

    artifacts:
      - build/ios/ipa/*.ipa
      # 伏せ先（`/tmp/xcodebuild_logs`）も JUnit の XML も、
      # `run-tests` をやめた時点で出なくなった。自分で書いた全文ログと
      # `-resultBundlePath` の結果を残す
      - /tmp/xcodebuild-full.log
      - build/ios/test/Test.xcresult

    publishing:
      app_store_connect:
        auth: integration
        # **TestFlight まで。審査には自動で出さない**
        # （出す前にスクリーンショットと説明文を入れる必要がある）
        submit_to_testflight: true
        submit_to_app_store: false

      email:
        recipients:
          - journey.photo.official@gmail.com
        notify:
          success: true
          failure: true
